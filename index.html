<script>

// ===================== Hilfsfunktionen =====================
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const wrapA = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
function shade(hex, f) {
  let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  const t = f < 0 ? 0 : 255, p = Math.abs(f);
  r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return `rgb(${r},${g},${b})`;
}
let seed = 1337;
function rnd() { // deterministischer Zufall, damit die Strecke immer gleich aussieht
  seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60), c = Math.floor((t * 100) % 100);
  return `${m}:${String(s).padStart(2, '0')}.${String(c).padStart(2, '0')}`;
}

// ===================== Strecken =====================
// Jede Strecke: Kontrollpunkte einer geschlossenen Spline, Kartengröße, Straßenbreite und Landschaft
const TRACKS = [

  { name: 'Herbstwald', theme: 'autumn', size: 1792, road: 80,

    ctrl: [[988,1561],[669,1726],[331,1410],[337,984],[350,619],[830,726],[878,218],[1238,196],[1320,669],[1741,754],[1599,1153],[1413,1306],[1374,1742]] },
  { name: 'Roter Canyon', theme: 'canyon', size: 2048, road: 84,

];

const THEMES = {
  meadow:  { grass: ['#41a54e', '#389646'], border: '#d9c27e', road: '#65656e', curb: ['#ffffff', '#e03030'], line: 'rgba(255,255,255,.55)',
             outside: '#2f7d3a', sky: ['#3d8fe0', '#cdeaff'], mtn: ['#8fb0d6', '#6f97c2', '#3f8a4e'], trees: ['tree'], clouds: true },
  spring:  { grass: ['#5cbf4f', '#51b046'], border: '#e3d08e', road: '#6a6a74', curb: ['#ffffff', '#f06292'], line: 'rgba(255,255,255,.55)',
             outside: '#3f9a44', sky: ['#4aa0f0', '#d8f1ff'], mtn: ['#a4c4e6', '#7fa8d4', '#4c9a50'], trees: ['tree', 'tree', 'pine'], clouds: true },
  desert:  { grass: ['#e2c27a', '#d9b86d'], border: '#c99a5b', road: '#7a6c60', curb: ['#ffffff', '#d9822b'], line: 'rgba(255,255,255,.5)',
             outside: '#cfa767', sky: ['#e98f4a', '#fde3b0'], mtn: ['#d9a77a', '#c47f4f', '#a8683f'], trees: ['cactus', 'cactus', 'rock'], clouds: false },
  canyon:  { grass: ['#c4683e', '#b95f37'], border: '#e0a070', road: '#6b5c55', curb: ['#ffffff', '#c03030'], line: 'rgba(255,255,255,.5)',
             outside: '#a04c2c', sky: ['#4fa3e0', '#ffe0c0'], mtn: ['#c97a4f', '#a8553a', '#80402a'], trees: ['rock', 'cactus', 'rock'], clouds: true },
  beach:   { grass: ['#f1dfa8', '#ebd79c'], border: '#e2c07c', road: '#6e6e78', curb: ['#ffffff', '#1e88e5'], line: 'rgba(255,255,255,.55)',
             outside: '#2a8fd0', sky: ['#2f9be8', '#c9f0ff'], mtn: ['#9fd3ef', '#6fb8e0', '#2f7fc0'], trees: ['palm'], clouds: true },
  snow:    { grass: ['#f2f6fb', '#e4ecf5'], border: '#b9c9dc', road: '#5d6470', curb: ['#ffffff', '#2f6fd6'], line: 'rgba(255,255,255,.6)',
             outside: '#dfe8f2', sky: ['#6c9fd8', '#e6f1ff'], mtn: ['#ffffff', '#c8d8ec', '#9db4cf'], trees: ['snowpine'], clouds: true },
  autumn:  { grass: ['#8a9a3c', '#7f8e35'], border: '#a8743a', road: '#5f5a58', curb: ['#ffffff', '#c0392b'], line: 'rgba(255,255,255,.5)',
             outside: '#6b7a2c', sky: ['#7aa8d8', '#f3d9b0'], mtn: ['#b48a6a', '#9a6a4a', '#6f6a2a'], trees: ['autumn', 'autumn', 'pine'], clouds: true },
  volcano: { grass: ['#3b3236', '#342c30'], border: '#7a3418', road: '#55505a', curb: ['#ffcc33', '#222222'], line: 'rgba(255,200,80,.55)',
             outside: '#d8461b', sky: ['#3a1f2b', '#e0603a'], mtn: ['#5a2c2c', '#3d2222', '#2a1818'], trees: ['lavarock', 'rock'], clouds: false },
  night:   { grass: ['#1f4a2a', '#1b4226'], border: '#5a5340', road: '#3c3c48', curb: ['#dddddd', '#c02828'], line: 'rgba(255,255,160,.7)',
             outside: '#163a20', sky: ['#070b1f', '#2a3a6a'], mtn: ['#1a2340', '#141b33', '#0f2a18'], trees: ['tree', 'pine'], stars: true },
  polar:   { grass: ['#c9d6ea', '#bccbe2'], border: '#8ea2c2', road: '#4a5060', curb: ['#ffffff', '#3fa0ff'], line: 'rgba(255,255,255,.6)',
             outside: '#a9bad4', sky: ['#0b1530', '#3b5a8a'], mtn: ['#d6e2f2', '#9fb2cf', '#6e83a8'], trees: ['snowpine', 'rock'], stars: true },
};

const hexRgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (h, a) => { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; };

const MM = 190;                           // Größe der Minikarte
const SW = Math.round(2 * Math.PI * FOCAL); // Breite des Rundum-Panoramas
// Zustand der gerade geladenen Strecke
let trackIdx = 0, builtTrack = -1, track, theme, MAP, ROAD, path, N, pads, trees;
let texBuf, ground, OUTSIDE, mini, mmS, mtn, skyGrad, fogGrad;

// Catmull-Rom-Spline durch die Kontrollpunkte, gleichmäßig alle 10 Einheiten abgetastet
function splinePath(ctrl) {
  const dense = [], n = ctrl.length;
  for (let i = 0; i < n; i++) {
    const p0 = ctrl[(i - 1 + n) % n], p1 = ctrl[i], p2 = ctrl[(i + 1) % n], p3 = ctrl[(i + 2) % n];
    for (let s = 0; s < 40; s++) {
      const t = s / 40, t2 = t * t, t3 = t2 * t;
      const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
      dense.push({ x: f(p0[0], p1[0], p2[0], p3[0]), y: f(p0[1], p1[1], p2[1], p3[1]) });
    }
  }
  let pts = [{ ...dense[0] }];
  const STEP = 10; let need = STEP;
  for (let i = 1; i <= dense.length; i++) {
    const a = dense[i - 1], b = dense[i % dense.length];
    const d = Math.hypot(b.x - a.x, b.y - a.y); let pos = 0;
    while (d - pos >= need) { pos += need; const t = pos / d; pts.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }); need = STEP; }
    need -= d - pos;
  }
  const l = pts[pts.length - 1];
  if (Math.hypot(l.x - pts[0].x, l.y - pts[0].y) < STEP / 2) pts.pop();
  const M = pts.length;
  pts.forEach((p, i) => {
    const a = pts[(i - 1 + M) % M], b = pts[(i + 1) % M];
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
    p.tx = dx / len; p.ty = dy / len; p.nx = -p.ty; p.ny = p.tx; p.ang = Math.atan2(dy, dx);
  });
  // Start/Ziel auf die geradeste Stelle legen, damit die Startaufstellung nicht in einer Kurve steht
  let best = 0, bestCurv = Infinity;
  for (let i = 0; i < M; i++) {
    let c = 0;
    for (let k = -22; k <= 6; k++) c += Math.abs(wrapA(pts[(i + k + 1 + M) % M].ang - pts[(i + k + M) % M].ang));
    if (c < bestCurv) { bestCurv = c; best = i; }
  }
  return pts.slice(best).concat(pts.slice(0, best));
}

// Bäume, Kakteen, Palmen, Felsen … als Sprites
const DECO_CACHE = {};
function decoSprite(kind) {
  if (DECO_CACHE[kind]) return DECO_CACHE[kind];
  let c, ww;
  const circle = (g, x, y, r, col) => { g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); };
  const poly = (g, pts, col) => { g.fillStyle = col; g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.fill(); };
  if (kind === 'tree' || kind === 'autumn') {
    c = mkCanvas(24, 40); ww = 28; const g = c.getContext('2d');
    const cols = kind === 'tree' ? ['#1f6b2c', '#2a8a3a', '#36a447', '#5cc46b'] : ['#8a3b12', '#c0571b', '#e08a1e', '#f2c04a'];
    g.fillStyle = '#6b4423'; g.fillRect(10, 26, 5, 14);
    circle(g, 12, 19, 10, cols[0]); circle(g, 8, 15, 7, cols[1]); circle(g, 16, 13, 7, cols[1]);
    circle(g, 12, 8, 7, cols[2]); circle(g, 10, 6, 3, cols[3]);
  } else if (kind === 'pine' || kind === 'snowpine') {
    c = mkCanvas(24, 44); ww = 24; const g = c.getContext('2d');
    g.fillStyle = '#5a3a1e'; g.fillRect(10, 34, 4, 10);
    const cols = ['#1d5a32', '#226b3a', '#2a7d44'];
    for (let k = 0; k < 3; k++) {
      const top = 2 + k * 9, bot = 20 + k * 8, hw = 6 + k * 3;
      poly(g, [[12, top], [12 + hw, bot], [12 - hw, bot]], cols[k]);
      if (kind === 'snowpine') {
        const h = (bot - top) * 0.45;
        poly(g, [[12, top], [12 + hw * 0.45, top + h], [12 - hw * 0.45, top + h]], '#f4f8ff');
      }
    }
  } else if (kind === 'palm') {
    c = mkCanvas(32, 48); ww = 30; const g = c.getContext('2d');
    g.strokeStyle = '#8a5a2b'; g.lineWidth = 3; g.beginPath(); g.moveTo(14, 48); g.quadraticCurveTo(11, 28, 18, 12); g.stroke();
    for (const [a, col, len] of [[-2.9, '#2f9a3f', 11], [-2.2, '#46b552', 10], [-1.5, '#2f9a3f', 9], [-0.8, '#46b552', 10], [-0.15, '#2f9a3f', 11], [0.5, '#3aa84a', 9]]) {
      g.save(); g.translate(18, 12); g.rotate(a); g.fillStyle = col; g.beginPath(); g.ellipse(len * 0.8, 0, len, 2.6, 0, 0, 7); g.fill(); g.restore();
    }
    circle(g, 16, 14, 2, '#6b4a1e'); circle(g, 20, 14, 2, '#6b4a1e');
  } else if (kind === 'cactus') {
    c = mkCanvas(24, 40); ww = 20; const g = c.getContext('2d');
    g.fillStyle = '#3f8f3a';
    g.fillRect(9, 6, 6, 34); circle(g, 12, 6, 3, '#3f8f3a');
    g.fillStyle = '#3f8f3a'; g.fillRect(3, 18, 7, 4); g.fillRect(3, 10, 4, 10); circle(g, 5, 10, 2, '#3f8f3a');
    g.fillStyle = '#3f8f3a'; g.fillRect(14, 22, 7, 4); g.fillRect(17, 14, 4, 10); circle(g, 19, 14, 2, '#3f8f3a');
    g.fillStyle = '#5fb150'; g.fillRect(10, 5, 1, 33); g.fillRect(4, 10, 1, 9); g.fillRect(18, 14, 1, 9);
  } else { // rock / lavarock
    c = mkCanvas(30, 20); ww = 26; const g = c.getContext('2d');
    const lava = kind === 'lavarock';
    poly(g, [[1, 20], [3, 10], [10, 3], [20, 2], [27, 8], [29, 20]], lava ? '#2e2629' : '#6d6862');
    poly(g, [[5, 10], [10, 4], [20, 3], [25, 8], [16, 9]], lava ? '#4a3d42' : '#8c867e');
    if (lava) { g.strokeStyle = '#ff7a1a'; g.lineWidth = 1; g.beginPath(); g.moveTo(8, 19); g.lineTo(12, 13); g.lineTo(17, 15); g.lineTo(21, 9); g.stroke(); }
  }
  return (DECO_CACHE[kind] = { img: c, ww });
}

function tracePath(g, s = 1) {
  g.beginPath();
  path.forEach((p, i) => i ? g.lineTo(p.x * s, p.y * s) : g.moveTo(p.x * s, p.y * s));
  g.closePath();
}
function strokePath(g, width, style, dash) {
  tracePath(g); g.lineJoin = 'round'; g.lineWidth = width; g.strokeStyle = style;
  g.setLineDash(dash || []); g.stroke(); g.setLineDash([]);
}
function drawPad(g, pad, fill, arrows) {
  const p = path[pad.i];
  g.save(); g.translate(p.x + p.nx * pad.off, p.y + p.ny * pad.off); g.rotate(p.ang);
  g.fillStyle = fill; g.fillRect(-16, -11, 32, 22);
  if (arrows) {
    g.fillStyle = '#ff7a00';
    for (let k = -12; k <= 4; k += 8) { g.beginPath(); g.moveTo(k, -8); g.lineTo(k + 7, 0); g.lineTo(k, 8); g.lineTo(k + 3, 0); g.closePath(); g.fill(); }
  }
  g.restore();
}
function surfaceAt(x, y) {
  const u = x | 0, v = y | 0;
  return (u < 0 || v < 0 || u >= MAP || v >= MAP) ? 0 : ground[v * MAP + u];
}

function buildTrack(i) {
  track = TRACKS[i]; theme = THEMES[track.theme]; builtTrack = i;
  seed = 1337 + i * 7919; // gleiche Bäume auf allen Rechnern
  MAP = track.size; ROAD = track.road;
  path = splinePath(track.ctrl); N = path.length;

  // Boost-Felder auf den geradesten Abschnitten (mehr auf langen Strecken)
  const curvAt = i => Math.abs(wrapA(path[(i + 8) % N].ang - path[(i - 8 + N) % N].ang));
  const padCount = N > 450 ? 5 : 3;
  pads = [];
  for (const i of [...Array(N).keys()].filter(i => i > 30 && i < N - 30).sort((a, b) => curvAt(a) - curvAt(b))) {
    if (pads.every(p => Math.min(Math.abs(i - p.i), N - Math.abs(i - p.i)) > N / (padCount + 1)))
      pads.push({ i, off: [-18, 18, 0, 18, -18][pads.length] });
    if (pads.length === padCount) break;
  }

  // Deko neben der Strecke
  trees = [];
  const want = Math.min(240, Math.round(90 * (MAP / 1024) ** 2));
  for (let tries = 0; trees.length < want && tries < want * 60; tries++) {
    const x = 30 + rnd() * (MAP - 60), y = 30 + rnd() * (MAP - 60);
    let md = Infinity;
    for (const p of path) { const d = (p.x - x) ** 2 + (p.y - y) ** 2; if (d < md) md = d; }
    if (md < (ROAD / 2 + 45) ** 2) continue;
    if (trees.some(t => (t.x - x) ** 2 + (t.y - y) ** 2 < 42 ** 2)) continue;
    trees.push({ x, y, s: decoSprite(theme.trees[Math.floor(rnd() * theme.trees.length)]) });
  }

  // farbige Bodentextur
  const tex = mkCanvas(MAP, MAP), tg = tex.getContext('2d');
  for (let y = 0; y < MAP; y += 32) for (let x = 0; x < MAP; x += 32) {
    tg.fillStyle = theme.grass[((x + y) / 32) % 2]; tg.fillRect(x, y, 32, 32);
  }
  for (const t of trees) { tg.fillStyle = 'rgba(0,0,0,.25)'; tg.beginPath(); tg.ellipse(t.x + 3, t.y + 2, 13, 8, 0, 0, 7); tg.fill(); }
  strokePath(tg, ROAD + 40, theme.border);
  strokePath(tg, ROAD + 12, theme.curb[0]);
  strokePath(tg, ROAD + 12, theme.curb[1], [14, 14]);
  strokePath(tg, ROAD, theme.road);
  strokePath(tg, 3, theme.line, [20, 20]);
  { // Start-/Ziellinie
    const p = path[0];
    tg.save(); tg.translate(p.x, p.y); tg.rotate(p.ang);
    for (let i = -ROAD / 2; i < ROAD / 2; i += 7) for (let j = 0; j < 2; j++) {
      tg.fillStyle = ((Math.round(i / 7) + j) & 1) ? '#fff' : '#111'; tg.fillRect(j * 7 - 7, i, 7, 7);
    }
    tg.restore();
  }
  for (const pad of pads) drawPad(tg, pad, '#ffd23f', true);
  const td = tg.getImageData(0, 0, MAP, MAP), a = td.data;
  for (let i = 0; i < a.length; i += 4) { const n = (rnd() - 0.5) * 18; a[i] += n; a[i + 1] += n; a[i + 2] += n; }
  texBuf = new Uint32Array(td.data.buffer);
  const [orr, og, ob] = hexRgb(theme.outside);
  OUTSIDE = (0xff000000 | (ob << 16) | (og << 8) | orr) >>> 0;

  // Untergrund-Maske: 0 = Gelände, 1 = Straße, 2 = Boost
  const mask = mkCanvas(MAP, MAP), mg = mask.getContext('2d');
  mg.fillStyle = '#000'; mg.fillRect(0, 0, MAP, MAP);
  strokePath(mg, ROAD + 12, '#f00');
  for (const pad of pads) drawPad(mg, pad, '#0f0', false);
  const md = mg.getImageData(0, 0, MAP, MAP).data;
  ground = new Uint8Array(MAP * MAP);
  for (let i = 0; i < ground.length; i++) ground[i] = md[i * 4 + 1] > 128 ? 2 : md[i * 4] > 128 ? 1 : 0;

  // Himmel und Berge (Panorama, rundum kachelbar)
  mtn = mkCanvas(SW, HORIZON + 1);
  const g = mtn.getContext('2d');
  if (theme.stars) {
    for (let i = 0; i < 260; i++) {
      g.fillStyle = `rgba(255,255,255,${0.4 + rnd() * 0.6})`;
      g.fillRect(Math.floor(rnd() * SW), Math.floor(rnd() * (HORIZON - 12)), 1, 1);
    }
    g.fillStyle = '#f4f1dc'; g.beginPath(); g.arc(SW * 0.3, 16, 7, 0, 7); g.fill();
  }
  if (theme.clouds) {
    g.fillStyle = 'rgba(255,255,255,.85)';
    for (let i = 0; i < 14; i++) {
      const cx = rnd() * SW, cy = 8 + rnd() * 22;
      for (let k = 0; k < 4; k++) { g.beginPath(); g.ellipse(cx + k * 9 - 13, cy + (k % 2) * 2, 10 + rnd() * 6, 4 + rnd() * 2, 0, 0, 7); g.fill(); }
    }
  }
  const layer = (color, base, amp, s) => {
    g.fillStyle = color; g.beginPath(); g.moveTo(0, HORIZON + 1);
    for (let x = 0; x <= SW; x += 2) {

const ENG_BASE = 40; // Grundfrequenz (Zündungen pro Sekunde) des Motor-Samples

// Ein Stück "Motor" aus einzelnen Zündimpulsen: jeder Impuls ist ein kurzer, abklingender
// Knall mit Auspuff-Resonanz. Leichte Zufallsschwankungen machen ihn weniger steril.

    for (let i = 0; i < cl; i++) {
      const t = i / sr;

      const crack = Math.exp(-t * 700) * (Math.random() * 2 - 1) * 0.2;

function updateEngineSound(dt) {

  const t = actx.currentTime;

  const thr = active && playerInput().gas ? 1 : 0;
  const v = player ? Math.abs(player.speed) : 0;

// Eigener Server (server.py): bildet dieselben Funktionen nach wie die Claude-"room"-Funktion
function connectServer() {
  if (!/^https?:$/.test(location.protocol)) return null;
  const raum = (new URLSearchParams(location.search).get('raum') || 'lobby').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 32) || 'lobby';
  roomLabel = raum;
  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?raum=' + raum;
  let ws = null, me = null, myPres = {}, snapshot = [], dirty = true;
  const others = new Map();
  function open() {
    ws = new WebSocket(url);
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === 'hello') {
        me = m.you; others.clear();
        for (const p of m.peers || []) others.set(p.peer, p.p || {});
        ws.send(JSON.stringify({ t: 'p', d: myPres }));
      } else if (m.t === 'p') others.set(m.peer, m.p || {});
      else if (m.t === 'left') others.delete(m.peer);

    };
    ws.onclose = () => { me = null; others.clear(); dirty = true; setTimeout(open, 2000); };
  }
  open();

    peers() {
      if (dirty) {
        snapshot = [];
        if (me) snapshot.push({ peer: me, presence: myPres, isMe: true, sameTab: true, kind: 'viewer' });
        for (const [peer, presence] of others) snapshot.push({ peer, presence, isMe: false, sameTab: false, kind: 'viewer' });

      }
      return snapshot;
    },
    presence(patch) {

      for (const k in patch) { if (patch[k] === null) delete next[k]; else next[k] = patch[k]; }

    },

(async () => {

  if (!optionsOpen && pausedByOptions) { paused = false; pausedByOptions = false; }

  else if (e.code === 'ArrowDown' || e.code === 'KeyS') optSel = (optSel + 1) % OPTIONS.length;

  if (e.code === 'Enter') {
    initAudio(); if (actx && actx.state === 'suspended') actx.resume();
    if ((state === 'menu' || (state === 'finish' && finishDelay <= 0)) && amHost()) hostStart();
  }
  if ((e.code === 'KeyP' || e.code === 'Escape') && soloRace() && (state === 'race' || state === 'countdown')) paused = !paused;
  if (e.code === 'KeyR' && state !== 'menu' && soloRace() && amHost()) hostStart();
  if (e.code === 'KeyM' && state !== 'menu') { muted = !muted; saveSound(); }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function playerInput() {
  if (optionsOpen) return { gas: false, brake: false, steer: 0, drift: false };
  return {
    gas: !!(keys.ArrowUp || keys.KeyW),
    brake: !!(keys.ArrowDown || keys.KeyS),
    steer: (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0),
    drift: !!(keys.Space || keys.ShiftLeft || keys.ShiftRight),
  };
}

// Computergegner: fahren den Wegpunkten hinterher und bremsen vor Kurven
function aiInput(k) {
  const look = k.speed > 100 ? 10 : 7;
  const tp = path[(k.idx + look) % N];
  const off = k.laneOff + Math.sin(time * 0.5 + k.phase) * 10;
  const desired = Math.atan2(tp.y + tp.ny * off - k.y, tp.x + tp.nx * off - k.x);
  const d = wrapA(desired - k.a);
  // Gummiband: wer weit vorne ist, wird etwas langsamer – und umgekehrt
  const gap = k.progress - player.progress;
  k.rb = k.isPlayer ? 1 : gap > N / 3 ? 0.92 : gap < -N / 4 ? 1.08 : 1;
  const c = Math.abs(wrapA(path[(k.idx + 14) % N].ang - path[(k.idx + 2) % N].ang));
  const target = k.maxSpeed * k.rb * (1 - Math.min(0.4, c * 0.45));
  return { gas: k.speed < target, brake: k.speed > target + 20, steer: clamp(d * 2.5, -1, 1), drift: false };
}

// ===================== Physik =====================
function updateKart(k, inp, dt) {
  const surf = surfaceAt(k.x, k.y);
  if (surf === 2) { if (k.boost <= 0 && k.isPlayer) beep(660, 0.25, 'sawtooth', 0.05); k.boost = Math.max(k.boost, 1.0); }

  let max = k.maxSpeed * k.rb;
  if (k.boost > 0) { max = k.maxSpeed * 1.45; k.boost -= dt; }
  else if (surf === 0) max = OFFROAD_MAX;

  if (inp.gas) k.speed += ACC * (k.boost > 0 ? 2.5 : 1) * dt;
  else if (inp.brake) k.speed -= (k.speed > 0 ? BRAKE : 60) * dt;
  else k.speed -= Math.sign(k.speed) * Math.min(Math.abs(k.speed), FRICTION * dt);
  if (k.speed > max) k.speed = Math.max(max, k.speed - 160 * dt);
  if (k.speed < -45) k.speed = -45;

  // Drift: Taste halten + lenken; loslassen gibt einen Mini-Turbo
  if (inp.drift && !k.drifting && inp.steer !== 0 && k.speed > 70 && surf !== 0) {
    k.drifting = true; k.driftDir = Math.sign(inp.steer); k.driftCharge = 0; k.hop = 0.25;
  }
  if (k.drifting) {
    if (surf === 0 || k.speed < 40) k.drifting = false;
    else if (!inp.drift) {
      if (k.driftCharge > 1.4) { k.boost = Math.max(k.boost, 1.1); if (k.isPlayer) beep(880, 0.3, 'sawtooth', 0.06); }
      else if (k.driftCharge > 0.7) { k.boost = Math.max(k.boost, 0.6); if (k.isPlayer) beep(620, 0.2, 'sawtooth', 0.05); }
      k.drifting = false;
    } else {
      const s = inp.steer * k.driftDir;
      k.a += k.driftDir * TURN * (0.75 + 0.5 * s) * dt;
      k.driftCharge += dt * (0.8 + 0.6 * Math.max(0, s));
    }
  }
  if (!k.drifting) k.a += inp.steer * TURN * Math.min(1, Math.abs(k.speed) / 50) * Math.sign(k.speed) * dt;
  k.a = wrapA(k.a);

  const grip = k.drifting ? 4 : 12;
  k.moveA = wrapA(k.moveA + wrapA(k.a - k.moveA) * Math.min(1, grip * dt));
  k.x += Math.cos(k.moveA) * k.speed * dt;
  k.y += Math.sin(k.moveA) * k.speed * dt;
  if (k.hop > 0) k.hop -= dt;
}

function collide() {
  // nur selbst simulierte Karts werden verschoben; fremde gelten als feste Hindernisse
  for (let i = 0; i < karts.length; i++) for (let j = i + 1; j < karts.length; j++) {
    const a = karts[i], b = karts[j];
    if (a.gone || b.gone || (a.remote && b.remote)) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d > 0 && d < 10) {
      const o = 10 - d, nx = dx / d, ny = dy / d;
      const wa = a.remote ? 0 : b.remote ? 1 : 0.5, wb = 1 - wa;
      a.x -= nx * o * wa; a.y -= ny * o * wa; b.x += nx * o * wb; b.y += ny * o * wb;
      const av = a.speed, bv = b.speed;
      if (!a.remote) a.speed = av * 0.88 + bv * 0.08;
      if (!b.remote) b.speed = bv * 0.88 + av * 0.08;
      if (a.isPlayer || b.isPlayer) beep(180, 0.08, 'square', 0.05);
    }
  }
  for (const k of karts) {
    if (k.remote) continue;
    for (const t of trees) {
      const dx = k.x - t.x, dy = k.y - t.y, d = Math.hypot(dx, dy);
      if (d > 0 && d < 10) {
        k.x = t.x + dx / d * 10; k.y = t.y + dy / d * 10; k.speed *= 0.3; k.drifting = false;
        if (k.isPlayer) beep(110, 0.15, 'square', 0.08);
      }
    }
    const nx = clamp(k.x, 10, MAP - 10), ny = clamp(k.y, 10, MAP - 10);
    if (nx !== k.x || ny !== k.y) { k.x = nx; k.y = ny; k.speed *= 0.5; }
  }
}

function updateProgress(k) {
  let best = k.idx, bd = Infinity;
  for (let j = -20; j <= 20; j++) {
    const i = (k.idx + j + N) % N, p = path[i], d = (p.x - k.x) ** 2 + (p.y - k.y) ** 2;
    if (d < bd) { bd = d; best = i; }
  }
  const diff = best - k.idx;
  if (diff < -N / 2) {
    k.lap++;
    if (k.lap > LAPS && !k.finished) {
      k.finished = true; k.finishTime = raceTime;
    } else if (k.isPlayer && k.lap >= 2) {
      msg = k.lap === LAPS ? 'LETZTE RUNDE!' : 'RUNDE ' + k.lap; msgT = 2;
      beep(k.lap === LAPS ? 990 : 770, 0.35, 'triangle', 0.1);
    }
  } else if (diff > N / 2) k.lap--;
  k.idx = best;
  k.progress = k.lap * N + best;
}

function ranking() {
  return karts.filter(k => !k.gone).sort((a, b) => {
    if (a.finished && b.finished) return a.finishTime - b.finishTime;
    if (a.finished !== b.finished) return a.finished ? -1 : 1;
    return b.progress - a.progress;
  });
}

function placeCam(dt) {
  if (state === 'menu') {
    const c = path[N - 5];
    cam.a = time * 0.25;
    cam.x = c.x - Math.cos(cam.a) * 75; cam.y = c.y - Math.sin(cam.a) * 75;
    return;
  }
  cam.a = wrapA(cam.a + wrapA(player.moveA - cam.a) * Math.min(1, dt * 5));
  cam.x = player.x - Math.cos(cam.a) * CAM_DIST;
  cam.y = player.y - Math.sin(cam.a) * CAM_DIST;
}

function update(dt) {
  time += dt;
  netTick(dt);
  if (rebuildT > 0 && (rebuildT -= dt) <= 0 && state === 'menu' && trackIdx !== builtTrack) buildTrack(trackIdx);
  if (msgT > 0) msgT -= dt;
  if (!paused) {
    if (state === 'countdown') {
      const before = Math.ceil(countdown);
      countdown -= dt;
      const after = Math.ceil(countdown);
      if (after !== before && after < 4) beep(after > 0 ? 440 : 880, after > 0 ? 0.15 : 0.45, 'square', 0.09);
      if (countdown <= 0) { state = 'race'; msg = 'LOS!'; msgT = 1; }
    }
    if (state === 'race' || state === 'finish') {
      raceTime += dt;
      for (const k of karts) {
        if (k.gone) continue;
        if (k.remote) updateRemote(k, dt);
        else updateKart(k, (k.isPlayer && !k.finished) ? playerInput() : aiInput(k), dt);
      }
      collide();
      for (const k of karts) if (!k.remote) updateProgress(k);
      if (state === 'race' && player.finished) {
        state = 'finish'; finishDelay = 1.5;
        const pos = ranking().indexOf(player) + 1;
        [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.3, 'triangle', 0.1), i * 140 * (pos === 1 ? 1 : 1.6)));
      }
      if (finishDelay > 0) finishDelay -= dt;
    }
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
  }
  placeCam(dt);

  updateEngineSound(dt);
}

// ===================== Rendering =====================
function renderFloor() {
  const fx = Math.cos(cam.a), fy = Math.sin(cam.a), rx = -fy, ry = fx;
  const MAP_ = MAP, tb = texBuf, OUT = OUTSIDE;
  for (let y = HORIZON + 1; y < H; y++) {
    const z = CAM_H * FOCAL / (y - HORIZON), s = z / FOCAL;
    let wx = cam.x + fx * z - rx * s * W / 2, wy = cam.y + fy * z - ry * s * W / 2;
    const dx = rx * s, dy = ry * s;
    let o = y * W;
    for (let x = 0; x < W; x++) {
      const u = Math.floor(wx), v = Math.floor(wy);
      buf[o++] = (u >= 0 && u < MAP_ && v >= 0 && v < MAP_) ? tb[v * MAP_ + u] : OUT;
      wx += dx; wy += dy;
    }
  }
}

function render() {
  // Himmel + Berge mit Parallaxe
  vctx.fillStyle = skyGrad; vctx.fillRect(0, 0, W, HORIZON + 1);
  const ox = -((((cam.a * FOCAL) % SW) + SW) % SW);
  vctx.drawImage(mtn, ox, 0); vctx.drawImage(mtn, ox + SW, 0);
  // Boden (Mode-7-artig)
  renderFloor();
  vctx.putImageData(img, 0, 0, 0, HORIZON + 1, W, H - HORIZON - 1);
  vctx.fillStyle = fogGrad; vctx.fillRect(0, HORIZON, W, 30);

  // Sprites projizieren und von hinten nach vorne zeichnen
  const cfx = Math.cos(cam.a), cfy = Math.sin(cam.a), crx = -cfy, cry = cfx;
  const project = (x, y) => {
    const dx = x - cam.x, dy = y - cam.y, z = dx * cfx + dy * cfy;
    if (z < 6 || z > 1400) return null;
    const sc = FOCAL / z, sx = W / 2 + (dx * crx + dy * cry) * sc;
    if (sx < -80 || sx > W + 80) return null;
    return { z, sc, sx, sy: HORIZON + CAM_H * sc };
  };
  const list = [];
  for (const t of trees) { const p = project(t.x, t.y); if (p) list.push({ ...p, deco: t.s }); }
  for (const k of karts) {
    k.label = null;
    if (k.gone || state === 'menu') continue;
    const p = project(k.x, k.y); if (p) list.push({ ...p, k });
  }
  list.sort((a, b) => b.z - a.z);

  for (const s of list) {
    if (s.deco) {
      const im = s.deco.img, w = s.deco.ww * s.sc, h = w * im.height / im.width;
      vctx.drawImage(im, s.sx - w / 2, s.sy - h, w, h);
      continue;
    }
    const k = s.k;
    const rel = wrapA(k.a - Math.atan2(k.y - cam.y, k.x - cam.x));
    let im = k.spr.back, flip = false, rot = 0;
    if (Math.abs(rel) > 2.4) im = k.spr.front;
    else if (Math.abs(rel) > 0.7) { im = k.spr.side; flip = rel < 0; }
    else rot = clamp(rel * 0.6, -0.3, 0.3);
    const w = im.width / PXU * s.sc, h = w * im.height / im.width;
    const lift = k.hop > 0 ? Math.sin((0.25 - k.hop) / 0.25 * Math.PI) * 2.5 * s.sc : 0;
    vctx.save(); vctx.translate(s.sx, s.sy - lift); vctx.rotate(rot); if (flip) vctx.scale(-1, 1);
    vctx.drawImage(im, -w / 2, -h, w, h);
    vctx.restore();
    if (k.human && !k.isPlayer) k.label = { x: s.sx, y: s.sy - lift - h };

    // Turbo-Flamme
    if (k.boost > 0 && im === k.spr.back) {
      for (const ex of [-1.7, 1.7]) {
        const r = s.sc * (1.1 + Math.random() * 0.7);
        vctx.fillStyle = '#ff7a00'; vctx.beginPath(); vctx.arc(s.sx + ex * s.sc, s.sy - lift - h * 0.17, r * 1.4, 0, 7); vctx.fill();
        vctx.fillStyle = '#ffe14d'; vctx.beginPath(); vctx.arc(s.sx + ex * s.sc, s.sy - lift - h * 0.17, r * 0.7, 0, 7); vctx.fill();
      }
    }
    // Funken beim Driften / Staub im Gras
    if (k.isPlayer && state !== 'menu' && !paused) {
      if (k.drifting) {
        const col = k.driftCharge > 1.4 ? '#ff9a1f' : k.driftCharge > 0.7 ? '#3fb8ff' : '#e8e8e8';
        for (const wx of [-4.5, 4.5]) particles.push({
          x: s.sx + wx * s.sc, y: s.sy - 1, vx: (wx > 0 ? 1 : -1) * (10 + Math.random() * 30) - k.driftDir * 15,
          vy: -20 - Math.random() * 30, life: 0.25 + Math.random() * 0.15, col, size: 1 + Math.random() * 1.5,
        });
      } else if (surfaceAt(k.x, k.y) === 0 && Math.abs(k.speed) > 30) {
        particles.push({ x: s.sx + (Math.random() - 0.5) * w, y: s.sy - 1, vx: (Math.random() - 0.5) * 40,
          vy: -15 - Math.random() * 20, life: 0.35, col: '#8a6a3a', size: 2 + Math.random() * 2 });
      }
    }
  }
  for (const p of particles) { vctx.fillStyle = p.col; vctx.fillRect(p.x, p.y, p.size, p.size); }

  // hochskalieren + HUD in voller Auflösung
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(view, 0, 0, OW, OH);
  drawHud();
}

function txt(s, x, y, size, align = 'left', fill = '#fff') {
  ctx.font = `italic 900 ${size}px "Segoe UI", system-ui, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(4, size / 6); ctx.strokeStyle = '#111'; ctx.strokeText(s, x, y);
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}

function drawHud() {

}

        const y = 260 + i * 66, col = k.isPlayer ? '#ffd23f' : '#fff';
        txt(`${i + 1}.`, OW / 2 - 240, y, 42, 'left', col);
        ctx.fillStyle = k.col; ctx.fillRect(OW / 2 - 165, y - 30, 28, 28);
        txt(k.name, OW / 2 - 120, y, 40, 'left', col);
        txt(k.finished ? fmtTime(k.finishTime) : 'fährt noch…', OW / 2 + 250, y, 34, 'right', col);
      });
      const host = amHost(), next = TRACKS[trackIdx].name;
      txt(host ? `◀  Nächste Strecke: ${next}  ▶` : `Nächste Strecke: ${next}`, OW / 2, 580, 30, 'center', '#ffe9a0');
      if (!host) txt(`Warte, bis ${peerName(hostPeer())} das nächste Rennen startet …`, OW / 2, 640, 30, 'center');
      else if (Math.floor(time * 2) % 2 === 0) txt('ENTER = neues Rennen', OW / 2, 645, 42, 'center');
    }
  }
}

// ===================== Hauptschleife =====================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
out.addEventListener('pointerdown', () => { out.focus(); window.focus(); });
out.focus();
</script>
