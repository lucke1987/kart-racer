<div id="wrap"><canvas id="c" width="1280" height="720" tabindex="0"></canvas></div>
<script>
'use strict';

// ===================== Konstanten =====================
const W = 384, H = 216;          // interne Render-Auflösung (Retro-Look)
const HORIZON = 70;              // Bildschirmzeile des Horizonts
const FOCAL = 220;               // Brennweite der Kamera
const CAM_H = 20, CAM_DIST = 48; // Kamerahöhe und Abstand hinter dem Kart
const MAP = 1024;                // Größe der Streckentextur
const ROAD = 84;                 // Straßenbreite
const LAPS = 3;

const ACC = 95, BRAKE = 180, FRICTION = 40, TURN = 2.1, OFFROAD_MAX = 55;

const out = document.getElementById('c'), ctx = out.getContext('2d');
const OW = out.width, OH = out.height;
const view = mkCanvas(W, H), vctx = view.getContext('2d');
vctx.imageSmoothingEnabled = false;
const img = vctx.createImageData(W, H), buf = new Uint32Array(img.data.buffer);

// ===================== Hilfsfunktionen =====================
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const wrapA = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
function shade(hex, f) {
  let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  const t = f < 0 ? 0 : 255, p = Math.abs(f);
  r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return `rgb(${r},${g},${b})`;
}
let seed = 1337;
function rnd() { // deterministischer Zufall, damit die Strecke immer gleich aussieht
  seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60), c = Math.floor((t * 100) % 100);
  return `${m}:${String(s).padStart(2, '0')}.${String(c).padStart(2, '0')}`;
}

// ===================== Strecke =====================
const ctrl = [[190,700],[195,460],[250,250],[420,150],[610,190],[690,350],[570,470],
              [610,610],[810,570],[890,720],[830,890],[600,910],[380,880],[220,850]];

// Catmull-Rom-Spline durch die Kontrollpunkte
const dense = [];
for (let i = 0; i < ctrl.length; i++) {
  const n = ctrl.length;
  const p0 = ctrl[(i - 1 + n) % n], p1 = ctrl[i], p2 = ctrl[(i + 1) % n], p3 = ctrl[(i + 2) % n];
  for (let s = 0; s < 40; s++) {
    const t = s / 40, t2 = t * t, t3 = t2 * t;
    const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
    dense.push({ x: f(p0[0], p1[0], p2[0], p3[0]), y: f(p0[1], p1[1], p2[1], p3[1]) });
  }
}
// gleichmäßig neu abtasten (alle 10 Einheiten ein Wegpunkt)
const path = [{ ...dense[0] }];
{
  const STEP = 10; let need = STEP;
  for (let i = 1; i <= dense.length; i++) {
    const a = dense[i - 1], b = dense[i % dense.length];
    const d = Math.hypot(b.x - a.x, b.y - a.y); let pos = 0;
    while (d - pos >= need) { pos += need; const t = pos / d; path.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }); need = STEP; }
    need -= d - pos;
  }
  const l = path[path.length - 1];
  if (Math.hypot(l.x - path[0].x, l.y - path[0].y) < STEP / 2) path.pop();
}
const N = path.length;
path.forEach((p, i) => {
  const a = path[(i - 1 + N) % N], b = path[(i + 1) % N];
  const dx = b.x - a.x, dy = b.y - a.y, l = Math.hypot(dx, dy);
  p.tx = dx / l; p.ty = dy / l; p.nx = -p.ty; p.ny = p.tx; p.ang = Math.atan2(dy, dx);
});

// Boost-Felder auf den geradesten Abschnitten
const curvAt = i => Math.abs(wrapA(path[(i + 8) % N].ang - path[(i - 8 + N) % N].ang));
const pads = [];
for (const i of [...Array(N).keys()].filter(i => i > 30 && i < N - 30).sort((a, b) => curvAt(a) - curvAt(b))) {
  if (pads.every(p => Math.min(Math.abs(i - p.i), N - Math.abs(i - p.i)) > N / 4)) pads.push({ i, off: [-18, 18, 0][pads.length] });
  if (pads.length === 3) break;
}

// Bäume neben der Strecke
const trees = [];
for (let tries = 0; trees.length < 90 && tries < 6000; tries++) {
  const x = 30 + rnd() * (MAP - 60), y = 30 + rnd() * (MAP - 60);
  let md = Infinity;
  for (const p of path) { const d = (p.x - x) ** 2 + (p.y - y) ** 2; if (d < md) md = d; }
  if (md < (ROAD / 2 + 45) ** 2) continue;
  if (trees.some(t => (t.x - x) ** 2 + (t.y - y) ** 2 < 42 ** 2)) continue;
  trees.push({ x, y });
}

function tracePath(g, s = 1) {
  g.beginPath();
  path.forEach((p, i) => i ? g.lineTo(p.x * s, p.y * s) : g.moveTo(p.x * s, p.y * s));
  g.closePath();
}
function strokePath(g, width, style, dash) {
  tracePath(g); g.lineJoin = 'round'; g.lineWidth = width; g.strokeStyle = style;
  g.setLineDash(dash || []); g.stroke(); g.setLineDash([]);
}
function drawPad(g, pad, fill, arrows) {
  const p = path[pad.i];
  g.save(); g.translate(p.x + p.nx * pad.off, p.y + p.ny * pad.off); g.rotate(p.ang);
  g.fillStyle = fill; g.fillRect(-16, -11, 32, 22);
  if (arrows) {
    g.fillStyle = '#ff7a00';
    for (let k = -12; k <= 4; k += 8) { g.beginPath(); g.moveTo(k, -8); g.lineTo(k + 7, 0); g.lineTo(k, 8); g.lineTo(k + 3, 0); g.closePath(); g.fill(); }
  }
  g.restore();
}

// --- Farbige Streckentextur ---
const tex = mkCanvas(MAP, MAP), tg = tex.getContext('2d');
for (let y = 0; y < MAP; y += 32) for (let x = 0; x < MAP; x += 32) {
  tg.fillStyle = ((x + y) / 32) % 2 ? '#41a54e' : '#389646'; tg.fillRect(x, y, 32, 32);
}
for (const t of trees) { tg.fillStyle = 'rgba(0,0,0,.25)'; tg.beginPath(); tg.ellipse(t.x + 3, t.y + 2, 13, 8, 0, 0, 7); tg.fill(); }
strokePath(tg, ROAD + 40, '#d9c27e');            // Sand
strokePath(tg, ROAD + 12, '#ffffff');            // Randsteine weiß
strokePath(tg, ROAD + 12, '#e03030', [14, 14]);  // Randsteine rot
strokePath(tg, ROAD, '#65656e');                 // Asphalt
strokePath(tg, 3, 'rgba(255,255,255,.55)', [20, 20]); // Mittellinie
{ // Start-/Ziellinie
  const p = path[0];
  tg.save(); tg.translate(p.x, p.y); tg.rotate(p.ang);
  for (let i = -ROAD / 2; i < ROAD / 2; i += 7) for (let j = 0; j < 2; j++) {
    tg.fillStyle = ((Math.round(i / 7) + j) & 1) ? '#fff' : '#111'; tg.fillRect(j * 7 - 7, i, 7, 7);
  }
  tg.restore();
}
for (const pad of pads) drawPad(tg, pad, '#ffd23f', true);
{ // leichtes Rauschen für mehr Geschwindigkeitsgefühl
  const d = tg.getImageData(0, 0, MAP, MAP), a = d.data;
  for (let i = 0; i < a.length; i += 4) { const n = (rnd() - 0.5) * 18; a[i] += n; a[i + 1] += n; a[i + 2] += n; }
  tg.putImageData(d, 0, 0);
}
const texBuf = new Uint32Array(tg.getImageData(0, 0, MAP, MAP).data.buffer);
const OUTSIDE = 0xff3a7d2f; // Farbe außerhalb der Karte (ABGR)

// --- Untergrund-Maske: 0 = Gras, 1 = Straße, 2 = Boost ---
const mask = mkCanvas(MAP, MAP), mg = mask.getContext('2d');
mg.fillStyle = '#000'; mg.fillRect(0, 0, MAP, MAP);
strokePath(mg, ROAD + 12, '#f00');
for (const pad of pads) drawPad(mg, pad, '#0f0', false);
const ground = new Uint8Array(MAP * MAP);
{ const md = mg.getImageData(0, 0, MAP, MAP).data;
  for (let i = 0; i < ground.length; i++) ground[i] = md[i * 4 + 1] > 128 ? 2 : md[i * 4] > 128 ? 1 : 0; }
function surfaceAt(x, y) {
  const u = x | 0, v = y | 0;
  return (u < 0 || v < 0 || u >= MAP || v >= MAP) ? 0 : ground[v * MAP + u];
}

// --- Himmel und Berge (Panorama, rundum kachelbar) ---
const SW = Math.round(2 * Math.PI * FOCAL);
const mtn = mkCanvas(SW, HORIZON + 1);
{
  const g = mtn.getContext('2d');
  g.fillStyle = 'rgba(255,255,255,.85)';
  for (let i = 0; i < 14; i++) {
    const cx = rnd() * SW, cy = 8 + rnd() * 22;
    for (let k = 0; k < 4; k++) { g.beginPath(); g.ellipse(cx + k * 9 - 13, cy + (k % 2) * 2, 10 + rnd() * 6, 4 + rnd() * 2, 0, 0, 7); g.fill(); }
  }
  const layer = (color, base, amp, s) => {
    g.fillStyle = color; g.beginPath(); g.moveTo(0, HORIZON + 1);
    for (let x = 0; x <= SW; x += 2) {
      const t = x / SW * Math.PI * 2;
      const h = base + amp * (0.5 * Math.sin(t * 3 + s) + 0.3 * Math.sin(t * 7 + s * 2) + 0.2 * Math.sin(t * 13 + s * 3));
      g.lineTo(x, HORIZON + 1 - Math.max(2, h));
    }
    g.lineTo(SW, HORIZON + 1); g.fill();
  };
  layer('#8fb0d6', 24, 16, 1);
  layer('#6f97c2', 14, 9, 2.5);
  layer('#3f8a4e', 7, 5, 4);
}
const skyGrad = vctx.createLinearGradient(0, 0, 0, HORIZON);
skyGrad.addColorStop(0, '#3d8fe0'); skyGrad.addColorStop(1, '#cdeaff');
const fogGrad = vctx.createLinearGradient(0, HORIZON, 0, HORIZON + 30);
fogGrad.addColorStop(0, 'rgba(205,234,255,.95)'); fogGrad.addColorStop(1, 'rgba(205,234,255,0)');

// ===================== Sprites =====================
const PXU = 32 / 12; // Sprite-Pixel pro Welteinheit (Kart ist 12 Einheiten breit)
function kartSprites(body, helmet) {
  const dark = shade(body, -0.35), mid = shade(body, -0.18), light = shade(body, 0.3), hd = shade(helmet, -0.35);
  const circle = (g, x, y, r) => { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); };
  function rear(front) {
    const c = mkCanvas(32, 26), g = c.getContext('2d');
    g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(16, 24, 15, 2.5, 0, 0, 7); g.fill();
    g.fillStyle = hd; g.fillRect(10, 8, 12, 6);
    g.fillStyle = helmet; circle(g, 16, 6, 5.5);
    if (front) { g.fillStyle = '#223'; g.fillRect(12, 4, 8, 3); g.fillStyle = '#fff'; g.fillRect(13, 4, 2, 1); }
    else { g.fillStyle = body; g.fillRect(13, 2, 6, 2); }
    g.fillStyle = '#151515'; g.fillRect(0, 14, 8, 10); g.fillRect(24, 14, 8, 10);
    g.fillStyle = '#555'; for (let y = 16; y < 24; y += 3) { g.fillRect(1, y, 6, 1); g.fillRect(25, y, 6, 1); }
    g.fillStyle = body; g.fillRect(6, 13, 20, 8);
    g.fillStyle = dark; g.fillRect(6, 19, 20, 3);
    g.fillStyle = light; g.fillRect(7, 13, 18, 1);
    if (front) {
      g.fillStyle = '#ffe680'; g.fillRect(8, 15, 4, 2); g.fillRect(20, 15, 4, 2);
      g.fillStyle = '#ccc'; g.fillRect(11, 11, 10, 2);
    } else {
      g.fillStyle = mid; g.fillRect(3, 10, 26, 3);
      g.fillStyle = '#999'; g.fillRect(10, 19, 3, 3); g.fillRect(19, 19, 3, 3);
      g.fillStyle = '#333'; g.fillRect(11, 20, 1, 1); g.fillRect(20, 20, 1, 1);
    }
    return c;
  }
  function side() {
    const c = mkCanvas(40, 26), g = c.getContext('2d');
    g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(20, 24, 19, 2.5, 0, 0, 7); g.fill();
    g.fillStyle = mid; g.fillRect(1, 9, 4, 7);
    g.fillStyle = hd; g.fillRect(14, 9, 8, 6);
    g.fillStyle = helmet; circle(g, 18, 6, 5.5);
    g.fillStyle = '#223'; g.fillRect(20, 4, 4, 3);
    g.fillStyle = body; g.beginPath(); g.moveTo(3, 13); g.lineTo(33, 13); g.lineTo(39, 17); g.lineTo(39, 20); g.lineTo(3, 20); g.closePath(); g.fill();
    g.fillStyle = dark; g.fillRect(3, 18, 36, 2);
    g.fillStyle = light; g.fillRect(4, 13, 28, 1);
    g.fillStyle = '#151515'; circle(g, 9, 20, 5); circle(g, 31, 20, 5);
    g.fillStyle = '#888'; circle(g, 9, 20, 2); circle(g, 31, 20, 2);
    return c;
  }
  return { back: rear(false), front: rear(true), side: side() };
}
const treeImg = mkCanvas(24, 40);
{
  const g = treeImg.getContext('2d');
  const blob = (x, y, r, c) => { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); };
  g.fillStyle = '#6b4423'; g.fillRect(10, 26, 5, 14);
  blob(12, 19, 10, '#1f6b2c'); blob(8, 15, 7, '#2a8a3a'); blob(16, 13, 7, '#2a8a3a');
  blob(12, 8, 7, '#36a447'); blob(10, 6, 3, '#5cc46b');
}

// --- Minikarte ---
const MM = 190, mmS = MM / MAP;
const mini = mkCanvas(MM, MM);
{
  const g = mini.getContext('2d'); g.lineJoin = 'round';
  tracePath(g, mmS); g.lineWidth = ROAD * mmS + 6; g.strokeStyle = 'rgba(0,0,0,.6)'; g.stroke();
  g.lineWidth = ROAD * mmS; g.strokeStyle = '#eee'; g.stroke();
}

// ===================== Sound =====================
let actx = null, master = null, muted = false;
let engSrc = null, engFilter = null, engGain = null, hissGain = null, subOsc = null, rpm = 0;
const ENG_BASE = 40; // Grundfrequenz (Zündungen pro Sekunde) des Motor-Samples

// Ein Stück "Motor" aus einzelnen Zündimpulsen: jeder Impuls ist ein kurzer, abklingender
// Knall mit Auspuff-Resonanz. Leichte Zufallsschwankungen machen ihn weniger steril.
function makeEngineBuffer() {
  const sr = actx.sampleRate, cl = Math.round(sr / ENG_BASE), cycles = 8;
  const b = actx.createBuffer(1, cl * cycles, sr), d = b.getChannelData(0);
  for (let c = 0; c < cycles; c++) {
    const amp = 0.75 + Math.random() * 0.5, shift = Math.floor((Math.random() - 0.5) * cl * 0.08);
    for (let i = 0; i < cl; i++) {
      const t = i / sr;
      const pulse = Math.exp(-t * 60) * (Math.sin(2 * Math.PI * 85 * t) + 0.35 * Math.sin(2 * Math.PI * 170 * t + 1));
      const crack = Math.exp(-t * 700) * (Math.random() * 2 - 1) * 0.2;
      d[c * cl + (i + shift + cl) % cl] += amp * (pulse + crack);
    }
  }
  let peak = 0; for (const v of d) peak = Math.max(peak, Math.abs(v));
  for (let i = 0; i < d.length; i++) d[i] /= peak;
  return b;
}

function initAudio() {
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.8; master.connect(actx.destination);

    // Motor: Sample → Verzerrung → Tiefpass → Lautstärke
    engSrc = actx.createBufferSource(); engSrc.buffer = makeEngineBuffer(); engSrc.loop = true;
    const shaper = actx.createWaveShaper(), curve = new Float32Array(1024);
    for (let i = 0; i < curve.length; i++) curve[i] = Math.tanh((i / 511.5 - 1) * 1.4);
    shaper.curve = curve;
    engFilter = actx.createBiquadFilter(); engFilter.type = 'lowpass'; engFilter.Q.value = 0.7;
    engGain = actx.createGain(); engGain.gain.value = 0;
    engSrc.connect(shaper).connect(engFilter).connect(engGain).connect(master);
    engSrc.start();
    // tiefer Sinus auf der Zündfrequenz gibt dem Motor mehr Bauch
    subOsc = actx.createOscillator(); subOsc.type = 'sine';
    const subMix = actx.createGain(); subMix.gain.value = 0.6;
    subOsc.connect(subMix).connect(engGain); subOsc.start();

    // Ansaug-/Fahrtwindrauschen
    const nb = actx.createBuffer(1, actx.sampleRate, actx.sampleRate), nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const noise = actx.createBufferSource(); noise.buffer = nb; noise.loop = true;
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 600; bp.Q.value = 0.7;
    hissGain = actx.createGain(); hissGain.gain.value = 0;
    noise.connect(bp).connect(hissGain).connect(master); noise.start();
  } catch (e) { actx = null; }
}
function beep(freq, dur, type = 'square', vol = 0.08) {
  if (!actx || muted) return;
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(master); o.start(); o.stop(t + dur);
}

// Drehzahl folgt Geschwindigkeit und Gaspedal; Tonhöhe, Klangfarbe und Lautstärke folgen der Drehzahl
function updateEngineSound(dt) {
  if (!actx || !engSrc) return;
  const t = actx.currentTime;
  const active = (state === 'race' || state === 'countdown') && !paused && player && !player.finished;
  const thr = active && playerInput().gas ? 1 : 0;
  const v = player ? Math.abs(player.speed) : 0;
  const target = !active ? 1800 : 1900 + v / 150 * 8000
    + thr * (state === 'countdown' ? 6000 : 600) + (player.boost > 0 ? 900 : 0);
  rpm += (target - rpm) * Math.min(1, dt * (target > rpm ? 7 : 3));
  const load = rpm / 10000;
  const fire = rpm / 100; // Zündungen pro Sekunde
  engSrc.playbackRate.setTargetAtTime(fire / ENG_BASE, t, 0.03);
  subOsc.frequency.setTargetAtTime(fire, t, 0.03);
  engFilter.frequency.setTargetAtTime(220 + rpm * 0.06 + thr * 350, t, 0.05);
  engGain.gain.setTargetAtTime(active ? 0.1 + 0.06 * thr + 0.05 * load : 0, t, active ? 0.05 : 0.4);
  hissGain.gain.setTargetAtTime(active ? 0.002 + 0.006 * load * (0.4 + thr) : 0, t, 0.1);
  master.gain.setTargetAtTime(muted ? 0 : 0.8, t, 0.02);
}

// ===================== Spielzustand =====================
const keys = {};
let state = 'menu', paused = false, countdown = 0, raceTime = 0, time = 0, finishDelay = 0;
let karts = [], player = null, msg = '', msgT = 0, particles = [];
const cam = { x: 0, y: 0, a: 0 };

// Startplatz-Farben; freie Plätze fahren Bots mit diesen Namen
const SLOT_LOOK = [
  { body: '#e53935', helmet: '#ffffff', bot: 'Flitzer', speed: 139 },
  { body: '#1e88e5', helmet: '#ffffff', bot: 'Blitz',   speed: 137 },
  { body: '#43a047', helmet: '#ffeb3b', bot: 'Turbo',   speed: 141 },
  { body: '#fdd835', helmet: '#e53935', bot: 'Rakete',  speed: 145 },
];
const SLOTS = [[N - 7, 16], [N - 7, -16], [N - 3, 16], [N - 3, -16]]; // Menschen starten hinten
for (const d of SLOT_LOOK) d.spr = kartSprites(d.body, d.helmet);

// ===================== Mehrspieler =====================
// Über die "room"-Funktion des Artifacts sieht jede offene Seite alle anderen.
// Jeder Spieler simuliert sein eigenes Kart und schickt dessen Zustand per presence;
// der Host (kleinste Peer-Kennung) startet Rennen und simuliert die Bots.
let room = null, roomLabel = '', myPeer = 'local', raceId = null, raceGrid = [], raceHost = 'local', lastRaceId = null, sendT = 0;
let myName = 'Spieler ' + (1 + Math.floor(Math.random() * 99));
try { const s = localStorage.getItem('kart.name'); if (s) myName = s.slice(0, 12); } catch (e) {}

// Eigener Server (server.py): bildet dieselben Funktionen nach wie die Claude-"room"-Funktion
function connectServer() {
  if (!/^https?:$/.test(location.protocol)) return null;
  const raum = (new URLSearchParams(location.search).get('raum') || 'lobby').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 32) || 'lobby';
  roomLabel = raum;
  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?raum=' + raum;
  let ws = null, me = null, myPres = {}, snapshot = [], dirty = true;
  const others = new Map();
  function open() {
    ws = new WebSocket(url);
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === 'hello') {
        me = m.you; others.clear();
        for (const p of m.peers || []) others.set(p.peer, p.p || {});
        ws.send(JSON.stringify({ t: 'p', d: myPres }));
      } else if (m.t === 'p') others.set(m.peer, m.p || {});
      else if (m.t === 'left') others.delete(m.peer);
      dirty = true;
    };
    ws.onclose = () => { me = null; others.clear(); dirty = true; setTimeout(open, 2000); };
  }
  open();
  return {
    peers() {
      if (dirty) {
        snapshot = [];
        if (me) snapshot.push({ peer: me, presence: myPres, isMe: true, sameTab: true, kind: 'viewer' });
        for (const [peer, presence] of others) snapshot.push({ peer, presence, isMe: false, sameTab: false, kind: 'viewer' });
        dirty = false;
      }
      return snapshot;
    },
    presence(patch) {
      const next = { ...myPres };
      for (const k in patch) { if (patch[k] === null) delete next[k]; else next[k] = patch[k]; }
      myPres = next; dirty = true;
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'p', d: patch }));
      return Promise.resolve();
    },
  };
}

(async () => {
  try {
    if (window.claude && window.claude.use) { // als claude.ai-Artifact
      const r = await window.claude.use('room');
      if (r) room = r;
    } else room = connectServer();
    if (room) room.presence({ name: myName, mode: 'lobby' }).catch(() => {});
  } catch (e) { room = null; }
})();

const viewers = () => room ? room.peers().filter(p => p.kind === 'viewer') : [];
function hostPeer() { const ps = viewers(); return ps.length ? ps.reduce((a, b) => a.peer < b.peer ? a : b) : null; }
function amHost() { const h = hostPeer(); return !h || (h.isMe && h.sameTab); }
const peerName = p => String((p.presence && p.presence.name) || 'Spieler').slice(0, 12);
const displayName = () => myName.trim() || 'Spieler';
const soloRace = () => !karts.some(k => k.human && k.remote);

// Kart-Zustand kompakt als Zahlenliste
const enc = k => [Math.round(k.x * 10) / 10, Math.round(k.y * 10) / 10, Math.round(k.a * 1000) / 1000, Math.round(k.speed),
  k.boost > 0 ? 1 : 0, k.lap, k.idx, k.finished ? 1 : 0, Math.round(k.finishTime * 100) / 100, k.hop > 0 ? 1 : 0, k.drifting ? k.driftDir : 0];

function applyRemote(k, s) {
  const v = s.map(Number);
  if (v.length < 11 || !v.every(Number.isFinite)) return;
  k.tx = clamp(v[0], 0, MAP); k.ty = clamp(v[1], 0, MAP); k.ta = v[2]; k.speed = clamp(v[3], -60, 260);
  k.boost = v[4] ? 0.2 : 0; k.lap = v[5] | 0; k.idx = clamp(v[6] | 0, 0, N - 1);
  k.finished = !!v[7]; k.finishTime = v[8]; k.hop = v[9] ? 0.1 : 0; k.drifting = !!v[10]; k.driftDir = Math.sign(v[10]);
  k.progress = k.lap * N + k.idx;
  if (!k.seen || Math.hypot(k.tx - k.x, k.ty - k.y) > 60) { k.x = k.tx; k.y = k.ty; k.a = k.moveA = k.ta; }
  k.seen = true;
}
function updateRemote(k, dt) { // zwischen zwei Nachrichten weiterrechnen und weich nachziehen
  if (!k.seen) return;
  k.tx += Math.cos(k.ta) * k.speed * dt; k.ty += Math.sin(k.ta) * k.speed * dt;
  const f = Math.min(1, dt * 10);
  k.x += (k.tx - k.x) * f; k.y += (k.ty - k.y) * f;
  k.a = wrapA(k.a + wrapA(k.ta - k.a) * f); k.moveA = k.a;
}

function sendPresence() {
  if (!room) return;
  const inRace = state !== 'menu' && player;
  const hosting = inRace && raceHost === myPeer;
  room.presence({
    name: displayName(),
    mode: state === 'countdown' || state === 'race' ? 'race' : state === 'finish' ? 'finish' : 'lobby',
    rid: inRace ? raceId : null,
    k: inRace ? enc(player) : null,
    b: hosting ? karts.filter(k => k.bot).map(enc) : null,
    race: hosting ? { id: raceId, grid: raceGrid } : null,
  }).catch(() => {});
}

function netTick(dt) {
  if (!room) return;
  const ps = room.peers(), byPeer = new Map(ps.map(p => [p.peer, p]));
  const me = ps.find(p => p.isMe && p.sameTab);
  if (me) myPeer = me.peer;
  // vom Host gestartetes Rennen übernehmen
  const h = hostPeer();
  if (h && !(h.isMe && h.sameTab) && (state === 'menu' || state === 'finish')) {
    const r = h.presence.race;
    if (r && typeof r.id === 'string' && r.id !== lastRaceId && Array.isArray(r.grid) && r.grid.includes(myPeer))
      startRace(r.id, r.grid.slice(0, 4).map(String), h.peer);
  }
  // Zustände der anderen Karts übernehmen
  for (const k of karts) {
    if (!k.remote) continue;
    const src = byPeer.get(k.peer);
    k.gone = !src;
    if (!src) continue;
    if (k.human) k.name = peerName(src);
    const pres = src.presence;
    if (pres === k.lastPres || pres.rid !== raceId) continue;
    k.lastPres = pres;
    const s = k.bot ? (Array.isArray(pres.b) ? pres.b[k.botIdx] : null) : pres.k;
    if (Array.isArray(s)) applyRemote(k, s);
  }
  sendT -= dt;
  if (sendT <= 0) { sendT = 0.05; sendPresence(); }
}

function startRace(id, grid, host) {
  raceId = lastRaceId = id; raceGrid = grid; raceHost = host;
  const hosting = host === myPeer;
  let botNo = 0;
  karts = SLOT_LOOK.map((d, i) => {
    const [idx, off] = SLOTS[i], p = path[idx];
    const human = i < grid.length, mine = human && grid[i] === myPeer;
    return {
      name: mine ? displayName() : human ? 'Spieler' : d.bot, col: d.body, spr: d.spr,
      isPlayer: mine, human, bot: !human, botIdx: human ? -1 : botNo++,
      peer: human ? grid[i] : host, remote: human ? !mine : !hosting, gone: false, seen: false, lastPres: null,
      maxSpeed: human ? 150 : d.speed, rb: 1,
      x: p.x + p.nx * off, y: p.y + p.ny * off, a: p.ang, moveA: p.ang, speed: 0,
      tx: 0, ty: 0, ta: 0, label: null,
      boost: 0, drifting: false, driftDir: 0, driftCharge: 0, hop: 0,
      lap: 0, idx, progress: idx, finished: false, finishTime: 0,
      laneOff: (rnd() * 2 - 1) * 14, phase: rnd() * 6,
    };
  });
  player = karts.find(k => k.isPlayer);
  cam.a = player.a; placeCam(1);
  state = 'countdown'; countdown = 3.99; raceTime = 0; paused = false; msg = ''; msgT = 0; particles = [];
  finishDelay = 0; sendT = 0;
}

function hostStart() {
  let grid = [myPeer];
  if (room && myPeer !== 'local') {
    const others = viewers()
      .filter(p => !(p.isMe && p.sameTab) && ['lobby', 'finish'].includes(p.presence.mode))
      .sort((a, b) => a.peer < b.peer ? -1 : 1).slice(0, 3);
    grid = [myPeer, ...others.map(p => p.peer)];
  }
  startRace(Math.random().toString(36).slice(2, 10), grid, myPeer);
}

// ===================== Steuerung =====================
function saveName() {
  try { localStorage.setItem('kart.name', myName); } catch (e) {}
  sendT = 0;
}
function editName(e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return false;
  if (e.code === 'Backspace') { myName = myName.slice(0, -1); saveName(); e.preventDefault(); return true; }
  if (e.key.length === 1 && /[\p{L}\p{N} _.-]/u.test(e.key)) {
    if (myName.length < 12) myName += e.key;
    saveName(); return true;
  }
  return false;
}
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Backspace'].includes(e.code)) e.preventDefault();
  if (state === 'menu' && editName(e)) return;
  if (e.repeat) return;
  if (e.code === 'Enter') {
    initAudio(); if (actx && actx.state === 'suspended') actx.resume();
    if ((state === 'menu' || (state === 'finish' && finishDelay <= 0)) && amHost()) hostStart();
  }
  if ((e.code === 'KeyP' || e.code === 'Escape') && soloRace() && (state === 'race' || state === 'countdown')) paused = !paused;
  if (e.code === 'KeyR' && state !== 'menu' && soloRace() && amHost()) hostStart();
  if (e.code === 'KeyM' && state !== 'menu') muted = !muted;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function playerInput() {
  return {
    gas: !!(keys.ArrowUp || keys.KeyW),
    brake: !!(keys.ArrowDown || keys.KeyS),
    steer: (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0),
    drift: !!(keys.Space || keys.ShiftLeft || keys.ShiftRight),
  };
}

// Computergegner: fahren den Wegpunkten hinterher und bremsen vor Kurven
function aiInput(k) {
  const look = k.speed > 100 ? 10 : 7;
  const tp = path[(k.idx + look) % N];
  const off = k.laneOff + Math.sin(time * 0.5 + k.phase) * 10;
  const desired = Math.atan2(tp.y + tp.ny * off - k.y, tp.x + tp.nx * off - k.x);
  const d = wrapA(desired - k.a);
  // Gummiband: wer weit vorne ist, wird etwas langsamer – und umgekehrt
  const gap = k.progress - player.progress;
  k.rb = k.isPlayer ? 1 : gap > N / 3 ? 0.92 : gap < -N / 4 ? 1.08 : 1;
  const c = Math.abs(wrapA(path[(k.idx + 14) % N].ang - path[(k.idx + 2) % N].ang));
  const target = k.maxSpeed * k.rb * (1 - Math.min(0.4, c * 0.45));
  return { gas: k.speed < target, brake: k.speed > target + 20, steer: clamp(d * 2.5, -1, 1), drift: false };
}

// ===================== Physik =====================
function updateKart(k, inp, dt) {
  const surf = surfaceAt(k.x, k.y);
  if (surf === 2) { if (k.boost <= 0 && k.isPlayer) beep(660, 0.25, 'sawtooth', 0.05); k.boost = Math.max(k.boost, 1.0); }

  let max = k.maxSpeed * k.rb;
  if (k.boost > 0) { max = k.maxSpeed * 1.45; k.boost -= dt; }
  else if (surf === 0) max = OFFROAD_MAX;

  if (inp.gas) k.speed += ACC * (k.boost > 0 ? 2.5 : 1) * dt;
  else if (inp.brake) k.speed -= (k.speed > 0 ? BRAKE : 60) * dt;
  else k.speed -= Math.sign(k.speed) * Math.min(Math.abs(k.speed), FRICTION * dt);
  if (k.speed > max) k.speed = Math.max(max, k.speed - 160 * dt);
  if (k.speed < -45) k.speed = -45;

  // Drift: Taste halten + lenken; loslassen gibt einen Mini-Turbo
  if (inp.drift && !k.drifting && inp.steer !== 0 && k.speed > 70 && surf !== 0) {
    k.drifting = true; k.driftDir = Math.sign(inp.steer); k.driftCharge = 0; k.hop = 0.25;
  }
  if (k.drifting) {
    if (surf === 0 || k.speed < 40) k.drifting = false;
    else if (!inp.drift) {
      if (k.driftCharge > 1.4) { k.boost = Math.max(k.boost, 1.1); if (k.isPlayer) beep(880, 0.3, 'sawtooth', 0.06); }
      else if (k.driftCharge > 0.7) { k.boost = Math.max(k.boost, 0.6); if (k.isPlayer) beep(620, 0.2, 'sawtooth', 0.05); }
      k.drifting = false;
    } else {
      const s = inp.steer * k.driftDir;
      k.a += k.driftDir * TURN * (0.75 + 0.5 * s) * dt;
      k.driftCharge += dt * (0.8 + 0.6 * Math.max(0, s));
    }
  }
  if (!k.drifting) k.a += inp.steer * TURN * Math.min(1, Math.abs(k.speed) / 50) * Math.sign(k.speed) * dt;
  k.a = wrapA(k.a);

  const grip = k.drifting ? 4 : 12;
  k.moveA = wrapA(k.moveA + wrapA(k.a - k.moveA) * Math.min(1, grip * dt));
  k.x += Math.cos(k.moveA) * k.speed * dt;
  k.y += Math.sin(k.moveA) * k.speed * dt;
  if (k.hop > 0) k.hop -= dt;
}

function collide() {
  // nur selbst simulierte Karts werden verschoben; fremde gelten als feste Hindernisse
  for (let i = 0; i < karts.length; i++) for (let j = i + 1; j < karts.length; j++) {
    const a = karts[i], b = karts[j];
    if (a.gone || b.gone || (a.remote && b.remote)) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d > 0 && d < 10) {
      const o = 10 - d, nx = dx / d, ny = dy / d;
      const wa = a.remote ? 0 : b.remote ? 1 : 0.5, wb = 1 - wa;
      a.x -= nx * o * wa; a.y -= ny * o * wa; b.x += nx * o * wb; b.y += ny * o * wb;
      const av = a.speed, bv = b.speed;
      if (!a.remote) a.speed = av * 0.88 + bv * 0.08;
      if (!b.remote) b.speed = bv * 0.88 + av * 0.08;
      if (a.isPlayer || b.isPlayer) beep(180, 0.08, 'square', 0.05);
    }
  }
  for (const k of karts) {
    if (k.remote) continue;
    for (const t of trees) {
      const dx = k.x - t.x, dy = k.y - t.y, d = Math.hypot(dx, dy);
      if (d > 0 && d < 10) {
        k.x = t.x + dx / d * 10; k.y = t.y + dy / d * 10; k.speed *= 0.3; k.drifting = false;
        if (k.isPlayer) beep(110, 0.15, 'square', 0.08);
      }
    }
    const nx = clamp(k.x, 10, MAP - 10), ny = clamp(k.y, 10, MAP - 10);
    if (nx !== k.x || ny !== k.y) { k.x = nx; k.y = ny; k.speed *= 0.5; }
  }
}

function updateProgress(k) {
  let best = k.idx, bd = Infinity;
  for (let j = -20; j <= 20; j++) {
    const i = (k.idx + j + N) % N, p = path[i], d = (p.x - k.x) ** 2 + (p.y - k.y) ** 2;
    if (d < bd) { bd = d; best = i; }
  }
  const diff = best - k.idx;
  if (diff < -N / 2) {
    k.lap++;
    if (k.lap > LAPS && !k.finished) {
      k.finished = true; k.finishTime = raceTime;
    } else if (k.isPlayer && k.lap >= 2) {
      msg = k.lap === LAPS ? 'LETZTE RUNDE!' : 'RUNDE ' + k.lap; msgT = 2;
      beep(k.lap === LAPS ? 990 : 770, 0.35, 'triangle', 0.1);
    }
  } else if (diff > N / 2) k.lap--;
  k.idx = best;
  k.progress = k.lap * N + best;
}

function ranking() {
  return karts.filter(k => !k.gone).sort((a, b) => {
    if (a.finished && b.finished) return a.finishTime - b.finishTime;
    if (a.finished !== b.finished) return a.finished ? -1 : 1;
    return b.progress - a.progress;
  });
}

function placeCam(dt) {
  if (state === 'menu') {
    const c = path[N - 5];
    cam.a = time * 0.25;
    cam.x = c.x - Math.cos(cam.a) * 75; cam.y = c.y - Math.sin(cam.a) * 75;
    return;
  }
  cam.a = wrapA(cam.a + wrapA(player.moveA - cam.a) * Math.min(1, dt * 5));
  cam.x = player.x - Math.cos(cam.a) * CAM_DIST;
  cam.y = player.y - Math.sin(cam.a) * CAM_DIST;
}

function update(dt) {
  time += dt;
  netTick(dt);
  if (msgT > 0) msgT -= dt;
  if (!paused) {
    if (state === 'countdown') {
      const before = Math.ceil(countdown);
      countdown -= dt;
      const after = Math.ceil(countdown);
      if (after !== before && after < 4) beep(after > 0 ? 440 : 880, after > 0 ? 0.15 : 0.45, 'square', 0.09);
      if (countdown <= 0) { state = 'race'; msg = 'LOS!'; msgT = 1; }
    }
    if (state === 'race' || state === 'finish') {
      raceTime += dt;
      for (const k of karts) {
        if (k.gone) continue;
        if (k.remote) updateRemote(k, dt);
        else updateKart(k, (k.isPlayer && !k.finished) ? playerInput() : aiInput(k), dt);
      }
      collide();
      for (const k of karts) if (!k.remote) updateProgress(k);
      if (state === 'race' && player.finished) {
        state = 'finish'; finishDelay = 1.5;
        const pos = ranking().indexOf(player) + 1;
        [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.3, 'triangle', 0.1), i * 140 * (pos === 1 ? 1 : 1.6)));
      }
      if (finishDelay > 0) finishDelay -= dt;
    }
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
  }
  placeCam(dt);

  updateEngineSound(dt);
}

// ===================== Rendering =====================
function renderFloor() {
  const fx = Math.cos(cam.a), fy = Math.sin(cam.a), rx = -fy, ry = fx;
  for (let y = HORIZON + 1; y < H; y++) {
    const z = CAM_H * FOCAL / (y - HORIZON), s = z / FOCAL;
    let wx = cam.x + fx * z - rx * s * W / 2, wy = cam.y + fy * z - ry * s * W / 2;
    const dx = rx * s, dy = ry * s;
    let o = y * W;
    for (let x = 0; x < W; x++) {
      const u = Math.floor(wx), v = Math.floor(wy);
      buf[o++] = (u >= 0 && u < MAP && v >= 0 && v < MAP) ? texBuf[v * MAP + u] : OUTSIDE;
      wx += dx; wy += dy;
    }
  }
}

function render() {
  // Himmel + Berge mit Parallaxe
  vctx.fillStyle = skyGrad; vctx.fillRect(0, 0, W, HORIZON + 1);
  const ox = -((((cam.a * FOCAL) % SW) + SW) % SW);
  vctx.drawImage(mtn, ox, 0); vctx.drawImage(mtn, ox + SW, 0);
  // Boden (Mode-7-artig)
  renderFloor();
  vctx.putImageData(img, 0, 0, 0, HORIZON + 1, W, H - HORIZON - 1);
  vctx.fillStyle = fogGrad; vctx.fillRect(0, HORIZON, W, 30);

  // Sprites projizieren und von hinten nach vorne zeichnen
  const cfx = Math.cos(cam.a), cfy = Math.sin(cam.a), crx = -cfy, cry = cfx;
  const project = (x, y) => {
    const dx = x - cam.x, dy = y - cam.y, z = dx * cfx + dy * cfy;
    if (z < 6 || z > 1400) return null;
    const sc = FOCAL / z, sx = W / 2 + (dx * crx + dy * cry) * sc;
    if (sx < -80 || sx > W + 80) return null;
    return { z, sc, sx, sy: HORIZON + CAM_H * sc };
  };
  const list = [];
  for (const t of trees) { const p = project(t.x, t.y); if (p) list.push({ ...p, tree: true }); }
  for (const k of karts) {
    k.label = null;
    if (k.gone || state === 'menu') continue;
    const p = project(k.x, k.y); if (p) list.push({ ...p, k });
  }
  list.sort((a, b) => b.z - a.z);

  for (const s of list) {
    if (s.tree) {
      const w = 28 * s.sc, h = w * treeImg.height / treeImg.width;
      vctx.drawImage(treeImg, s.sx - w / 2, s.sy - h, w, h);
      continue;
    }
    const k = s.k;
    const rel = wrapA(k.a - Math.atan2(k.y - cam.y, k.x - cam.x));
    let im = k.spr.back, flip = false, rot = 0;
    if (Math.abs(rel) > 2.4) im = k.spr.front;
    else if (Math.abs(rel) > 0.7) { im = k.spr.side; flip = rel < 0; }
    else rot = clamp(rel * 0.6, -0.3, 0.3);
    const w = im.width / PXU * s.sc, h = w * im.height / im.width;
    const lift = k.hop > 0 ? Math.sin((0.25 - k.hop) / 0.25 * Math.PI) * 2.5 * s.sc : 0;
    vctx.save(); vctx.translate(s.sx, s.sy - lift); vctx.rotate(rot); if (flip) vctx.scale(-1, 1);
    vctx.drawImage(im, -w / 2, -h, w, h);
    vctx.restore();
    if (k.human && !k.isPlayer) k.label = { x: s.sx, y: s.sy - lift - h };

    // Turbo-Flamme
    if (k.boost > 0 && im === k.spr.back) {
      for (const ex of [-1.7, 1.7]) {
        const r = s.sc * (1.1 + Math.random() * 0.7);
        vctx.fillStyle = '#ff7a00'; vctx.beginPath(); vctx.arc(s.sx + ex * s.sc, s.sy - lift - h * 0.17, r * 1.4, 0, 7); vctx.fill();
        vctx.fillStyle = '#ffe14d'; vctx.beginPath(); vctx.arc(s.sx + ex * s.sc, s.sy - lift - h * 0.17, r * 0.7, 0, 7); vctx.fill();
      }
    }
    // Funken beim Driften / Staub im Gras
    if (k.isPlayer && state !== 'menu' && !paused) {
      if (k.drifting) {
        const col = k.driftCharge > 1.4 ? '#ff9a1f' : k.driftCharge > 0.7 ? '#3fb8ff' : '#e8e8e8';
        for (const wx of [-4.5, 4.5]) particles.push({
          x: s.sx + wx * s.sc, y: s.sy - 1, vx: (wx > 0 ? 1 : -1) * (10 + Math.random() * 30) - k.driftDir * 15,
          vy: -20 - Math.random() * 30, life: 0.25 + Math.random() * 0.15, col, size: 1 + Math.random() * 1.5,
        });
      } else if (surfaceAt(k.x, k.y) === 0 && Math.abs(k.speed) > 30) {
        particles.push({ x: s.sx + (Math.random() - 0.5) * w, y: s.sy - 1, vx: (Math.random() - 0.5) * 40,
          vy: -15 - Math.random() * 20, life: 0.35, col: '#8a6a3a', size: 2 + Math.random() * 2 });
      }
    }
  }
  for (const p of particles) { vctx.fillStyle = p.col; vctx.fillRect(p.x, p.y, p.size, p.size); }

  // hochskalieren + HUD in voller Auflösung
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(view, 0, 0, OW, OH);
  drawHud();
}

function txt(s, x, y, size, align = 'left', fill = '#fff') {
  ctx.font = `italic 900 ${size}px "Segoe UI", system-ui, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(4, size / 6); ctx.strokeStyle = '#111'; ctx.strokeText(s, x, y);
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}

function drawHud() {
  if (state === 'menu') {
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, OW, OH);
    txt('KART RACER', OW / 2, 130, 110, 'center', '#ffd23f');
    txt('3 Runden, bis zu 4 Spieler – freie Plätze fahren Bots', OW / 2, 185, 28, 'center');
    const lines = ['Pfeiltasten oder WASD: Gas, Bremse, Lenken',
                   'LEERTASTE halten + lenken = Drift, loslassen = Turbo',
                   'Gelbe Pfeile = Boost      M = Ton aus'];
    lines.forEach((l, i) => txt(l, OW / 2, 240 + i * 38, 24, 'center', '#e8f2ff'));
    const cursor = Math.floor(time * 2) % 2 ? '_' : ' ';
    txt('Dein Name: ' + myName + cursor, OW / 2, 395, 34, 'center', '#ffe9a0');
    txt('(einfach tippen, Rücktaste löscht)', OW / 2, 425, 20, 'center', '#c8d4e4');

    const vs = viewers().slice().sort((a, b) => a.peer < b.peer ? -1 : 1);
    const h = hostPeer();
    if (room && vs.length > 1) {
      ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(OW / 2 - 300, 450, 600, 36 + Math.min(vs.length, 6) * 32);
      txt(`Im Raum: ${vs.length}`, OW / 2 - 280, 478, 24, 'left', '#ffd23f');
      vs.slice(0, 6).forEach((p, i) => {
        const me = p.isMe && p.sameTab, nm = me ? displayName() : peerName(p);
        const tag = [p === h ? 'Host' : '', me ? 'du' : '', p.presence.mode === 'race' ? 'fährt gerade' : ''].filter(Boolean).join(', ');
        txt(nm + (tag ? `  (${tag})` : ''), OW / 2 - 280, 512 + i * 32, 24, 'left', me ? '#ffe9a0' : '#fff');
      });
    } else {
      txt(room ? 'Teile den Link – wer die Seite öffnet, landet hier in der Lobby' : 'Einzelspieler-Modus', OW / 2, 490, 22, 'center', '#c8d4e4');
    }
    if (roomLabel) txt(`Raum: ${roomLabel}   (eigene Gruppe: ?raum=name an den Link hängen)`, OW / 2, 640, 20, 'center', '#c8d4e4');
    const startMsg = amHost() ? 'ENTER drücken zum Starten' : `Warte, bis ${peerName(h)} das Rennen startet …`;
    if (!amHost() || Math.floor(time * 2) % 2 === 0) txt(startMsg, OW / 2, 690, 40, 'center', '#ffffff');
    return;
  }

  // Namen über den Karts der Mitspieler
  for (const k of karts) if (k.label) txt(k.name, k.label.x * OW / W, k.label.y * OH / H - 6, 20, 'center', '#fff');

  const rank = ranking(), pos = rank.indexOf(player) + 1;
  // Runde und Zeit
  txt(`RUNDE ${clamp(player.lap, 1, LAPS)}/${LAPS}`, 30, 62, 46);
  txt(fmtTime(player.finished ? player.finishTime : raceTime), 30, 108, 34, 'left', '#ffe9a0');
  // Geschwindigkeit + Drift-Anzeige
  txt(`${Math.round(Math.abs(player.speed) * 0.8)} km/h`, 30, OH - 30, 38);
  if (player.drifting) {
    const c = player.driftCharge, col = c > 1.4 ? '#ff9a1f' : c > 0.7 ? '#3fb8ff' : '#bbb';
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(30, OH - 92, 220, 18);
    ctx.fillStyle = col; ctx.fillRect(33, OH - 89, 214 * Math.min(1, c / 1.4), 12);
  }
  // Platzierung
  const posCol = ['#ffd700', '#d8d8e0', '#e09050', '#ffffff'][pos - 1];
  txt(pos + '.', OW - 40, OH - 30, 130, 'right', posCol);
  // Minikarte
  const mx = OW - MM - 24, my = 24;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(mx - 6, my - 6, MM + 12, MM + 12);
  ctx.drawImage(mini, mx, my);
  for (const k of karts.filter(k => !k.gone).sort((a, b) => a.isPlayer - b.isPlayer)) {
    ctx.fillStyle = k.col; ctx.strokeStyle = k.isPlayer ? '#fff' : '#111'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(mx + k.x * mmS, my + k.y * mmS, k.isPlayer ? 7 : 5, 0, 7); ctx.fill(); ctx.stroke();
  }

  if (state === 'countdown') {
    const n = Math.ceil(countdown);
    if (n <= 3) txt(String(n), OW / 2, OH / 2 + 40, 180, 'center', ['#3f3', '#ff3', '#f43'][n - 1]);
  }
  if (msgT > 0 && state !== 'finish') txt(msg, OW / 2, OH / 2 - 40, msg === 'LOS!' ? 150 : 80, 'center', msg === 'LOS!' ? '#3f3' : '#ffd23f');
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, OW, OH);
    txt('PAUSE', OW / 2, OH / 2, 110, 'center');
    txt('P = weiter     R = Neustart', OW / 2, OH / 2 + 60, 30, 'center');
  }
  if (state === 'finish') {
    txt('ZIEL!', OW / 2, 150, 120, 'center', '#ffd23f');
    if (finishDelay <= 0) {
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(OW / 2 - 280, 200, 560, 330);
      rank.forEach((k, i) => {
        const y = 260 + i * 66, col = k.isPlayer ? '#ffd23f' : '#fff';
        txt(`${i + 1}.`, OW / 2 - 240, y, 42, 'left', col);
        ctx.fillStyle = k.col; ctx.fillRect(OW / 2 - 165, y - 30, 28, 28);
        txt(k.name, OW / 2 - 120, y, 40, 'left', col);
        txt(k.finished ? fmtTime(k.finishTime) : 'fährt noch…', OW / 2 + 250, y, 34, 'right', col);
      });
      if (!amHost()) txt(`Warte, bis ${peerName(hostPeer())} das nächste Rennen startet …`, OW / 2, 600, 32, 'center');
      else if (Math.floor(time * 2) % 2 === 0) txt('ENTER = neues Rennen', OW / 2, 600, 42, 'center');
    }
  }
}

// ===================== Hauptschleife =====================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
out.addEventListener('pointerdown', () => { out.focus(); window.focus(); });
out.focus();
</script>
