<style>
  /* Einzelner, bewusst dunkler Arcade-Look: Spielfläche zentriert auf schwarzem Grund */
  :root { --bg: #0d0f14; --btn: rgba(20, 24, 34, .45); --btn-on: rgba(255, 210, 63, .75); --btn-line: rgba(255, 255, 255, .7); --fg: #fff; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); outline: none; }

  /* Touch-Steuerung fürs Handy: ◀ ganz links, ▶ ganz rechts, daneben jeweils DRIFT,

  #touch { position: fixed; inset: 0; pointer-events: none; font: 800 italic 15px "Segoe UI", system-ui, sans-serif; color: var(--fg); }
  #touch button { pointer-events: auto; touch-action: none; position: absolute; border: 3px solid var(--btn-line); border-radius: 50%;
    background: var(--btn); color: var(--fg); font: inherit; width: 84px; height: 84px; padding: 0; display: grid; place-items: center; }
  #touch button.on { background: var(--btn-on); color: #111; }
  #touch[data-race="0"] .drive { display: none; }
  #t-start { left: 50%; transform: translateX(-50%); bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    width: auto !important; height: 50px !important; padding: 0 34px !important; border-radius: 28px !important;
    background: #ffd23f !important; color: #111 !important; font-size: 22px !important; border-color: #fff !important; }
  #touch[data-start="0"] #t-start { display: none; }
  #touch .drive { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  #t-left    { left: calc(14px + env(safe-area-inset-left, 0px)); width: 92px !important; height: 92px !important; font-size: 36px !important; }
  #t-right   { right: calc(14px + env(safe-area-inset-right, 0px)); width: 92px !important; height: 92px !important; font-size: 36px !important; }
  #t-drift-l { left: calc(118px + env(safe-area-inset-left, 0px)); width: 74px !important; height: 74px !important; font-size: 13px !important; }
  #t-drift-r { right: calc(118px + env(safe-area-inset-right, 0px)); width: 74px !important; height: 74px !important; font-size: 13px !important; }
  #t-item    { left: calc(24px + env(safe-area-inset-left, 0px)); bottom: calc(122px + env(safe-area-inset-bottom, 0px)) !important; width: 70px !important; height: 70px !important; }
  #t-brake   { right: calc(28px + env(safe-area-inset-right, 0px)); bottom: calc(122px + env(safe-area-inset-bottom, 0px)) !important; width: 64px !important; height: 64px !important; font-size: 12px !important; }

  #t-full  { left: calc(66px + env(safe-area-inset-left, 0px)); }
  #touch[data-race="1"] #t-menu, #touch[data-race="0"] #t-pause { display: none; }
  #t-pause { left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px));

  #room-name { background: rgba(0,0,0,.55); padding: 4px 12px; border-radius: 12px; }

function hiCanvas(w, h) { const c = mkCanvas(w * SS, h * SS), g = c.getContext('2d'); g.scale(SS, SS); return [c, g]; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const wrapA = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
function shade(hex, f) {
  let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  const t = f < 0 ? 0 : 255, p = Math.abs(f);
  r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return `rgb(${r},${g},${b})`;
}
let seed = 1337;
function rnd() { // deterministischer Zufall, damit die Strecke immer gleich aussieht
  seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60), c = Math.floor((t * 100) % 100);
  return `${m}:${String(s).padStart(2, '0')}.${String(c).padStart(2, '0')}`;

  }
  // Reifen von der Seite: Gummi, Felge mit Speichen, Nabe
  function wheel(g, cx, cy, r) {
    const gr = g.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.2, cx, cy, r);
    gr.addColorStop(0, '#3e3e3e'); gr.addColorStop(1, '#0e0e0e');
    g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
    const rim = g.createRadialGradient(cx - r * 0.15, cy - r * 0.15, 0, cx, cy, r * 0.5);
    rim.addColorStop(0, '#f4f4f4'); rim.addColorStop(1, '#9a9a9a');

    g.strokeStyle = '#666'; g.lineWidth = 0.45;

    g.strokeStyle = '#222'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(24.4, 9.4); g.lineTo(25.4, 13.6); g.stroke();
    helmetAt(g, 18, 5.6, 5, 'side');

let actx = null, master = null, muted = false;

let engSrc = null, engFilter = null, engGain = null, hissGain = null, subOsc = null, rpm = 0;
const ENG_BASE = 40; // Grundfrequenz (Zündungen pro Sekunde) des Motor-Samples

// Ein Stück "Motor" aus einzelnen Zündimpulsen: jeder Impuls ist ein kurzer, abklingender
// Knall mit Auspuff-Resonanz. Leichte Zufallsschwankungen machen ihn weniger steril.
function makeEngineBuffer() {
  const sr = actx.sampleRate, cl = Math.round(sr / ENG_BASE), cycles = 8;
  const b = actx.createBuffer(1, cl * cycles, sr), d = b.getChannelData(0);
  for (let c = 0; c < cycles; c++) {
    const amp = 0.75 + Math.random() * 0.5, shift = Math.floor((Math.random() - 0.5) * cl * 0.08);
    for (let i = 0; i < cl; i++) {
      const t = i / sr;
      const pulse = Math.exp(-t * 60) * (Math.sin(2 * Math.PI * 85 * t) + 0.35 * Math.sin(2 * Math.PI * 170 * t + 1));
      const crack = Math.exp(-t * 700) * (Math.random() * 2 - 1) * 0.2;
      d[c * cl + (i + shift + cl) % cl] += amp * (pulse + crack);
    }
  }
  let peak = 0; for (const v of d) peak = Math.max(peak, Math.abs(v));
  for (let i = 0; i < d.length; i++) d[i] /= peak;
  return b;
}

function initAudio() {
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.8; master.connect(actx.destination);

    // Motor: Sample → Verzerrung → Tiefpass → Lautstärke
    engSrc = actx.createBufferSource(); engSrc.buffer = makeEngineBuffer(); engSrc.loop = true;
    const shaper = actx.createWaveShaper(), curve = new Float32Array(1024);
    for (let i = 0; i < curve.length; i++) curve[i] = Math.tanh((i / 511.5 - 1) * 1.4);
    shaper.curve = curve;
    engFilter = actx.createBiquadFilter(); engFilter.type = 'lowpass'; engFilter.Q.value = 0.7;
    engGain = actx.createGain(); engGain.gain.value = 0;
    engSrc.connect(shaper).connect(engFilter).connect(engGain).connect(master);
    engSrc.start();
    // tiefer Sinus auf der Zündfrequenz gibt dem Motor mehr Bauch
    subOsc = actx.createOscillator(); subOsc.type = 'sine';
    const subMix = actx.createGain(); subMix.gain.value = 0.6;
    subOsc.connect(subMix).connect(engGain); subOsc.start();

    // Ansaug-/Fahrtwindrauschen
    const nb = actx.createBuffer(1, actx.sampleRate, actx.sampleRate), nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const noise = actx.createBufferSource(); noise.buffer = nb; noise.loop = true;
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 600; bp.Q.value = 0.7;
    hissGain = actx.createGain(); hissGain.gain.value = 0;
    noise.connect(bp).connect(hissGain).connect(master); noise.start();
  } catch (e) { actx = null; }
}
function beep(freq, dur, type = 'square', vol = 0.08) {
  if (!actx || muted || snd.fx <= 0) return;
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol * snd.fx, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(master); o.start(); o.stop(t + dur);

// Drehzahl folgt Geschwindigkeit und Gaspedal; Tonhöhe, Klangfarbe und Lautstärke folgen der Drehzahl
function updateEngineSound(dt) {
  if (!actx || !engSrc) return;
  const t = actx.currentTime;
  const active = (state === 'race' || state === 'countdown') && !paused && player && !player.finished;
  const thr = active && playerInput().gas ? 1 : 0;
  const v = player ? Math.abs(player.speed) : 0;
  const target = !active ? 1800 : 1900 + v / 150 * 8000
    + thr * (state === 'countdown' ? 6000 : 600) + (player.boost > 0 ? 900 : 0);
  rpm += (target - rpm) * Math.min(1, dt * (target > rpm ? 7 : 3));
  const load = rpm / 10000;
  const fire = rpm / 100; // Zündungen pro Sekunde
  engSrc.playbackRate.setTargetAtTime(fire / ENG_BASE, t, 0.03);
  subOsc.frequency.setTargetAtTime(fire, t, 0.03);
  engFilter.frequency.setTargetAtTime(220 + rpm * 0.06 + thr * 350, t, 0.05);
  engGain.gain.setTargetAtTime(active ? (0.1 + 0.06 * thr + 0.05 * load) * snd.engine : 0, t, active ? 0.05 : 0.4);
  hissGain.gain.setTargetAtTime(active ? (0.002 + 0.006 * load * (0.4 + thr)) * snd.engine : 0, t, 0.1);
  master.gain.setTargetAtTime(muted ? 0 : snd.master, t, 0.02);
}

// Über die "room"-Funktion des Artifacts sieht jede offene Seite alle anderen.
// Jeder Spieler simuliert sein eigenes Kart und schickt dessen Zustand per presence;
// der Host (kleinste Peer-Kennung) startet Rennen und simuliert die Bots.
let room = null, roomLabel = '', myPeer = 'local', raceId = null, raceGrid = [], raceHost = 'local', lastRaceId = null, sendT = 0;
let myName = 'Spieler ' + (1 + Math.floor(Math.random() * 99));
try { const s = localStorage.getItem('kart.name'); if (s) myName = s.slice(0, 12); } catch (e) {}

const cleanRoom = r => String(r || '').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 32) || 'lobby';

// Eigener Server (server.py): bildet dieselben Funktionen nach wie die Claude-"room"-Funktion
function connectServer() {
  if (!/^https?:$/.test(location.protocol)) return null;
  let ws = null, me = null, myPres = {}, snapshot = [], dirty = true, url = '';
  const others = new Map();
  function setRoom(name) {
    roomLabel = cleanRoom(name);
    url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?raum=' + roomLabel;
  }
  setRoom(new URLSearchParams(location.search).get('raum'));
  function open() {
    ws = new WebSocket(url);
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === 'hello') {
        me = m.you; others.clear();
        for (const p of m.peers || []) others.set(p.peer, p.p || {});
        ws.send(JSON.stringify({ t: 'p', d: myPres }));
      } else if (m.t === 'p') others.set(m.peer, m.p || {});
      else if (m.t === 'left') others.delete(m.peer);
      dirty = true;
    };
    ws.onclose = () => { me = null; others.clear(); dirty = true; setTimeout(open, 2000); };
  }
  open();
  return {
    // in einen anderen Raum wechseln, ohne die Seite neu zu laden
    switchRoom(name) {
      setRoom(name);
      ws.onclose = null; ws.close();
      me = null; others.clear(); dirty = true;
      open();
    },
    peers() {
      if (dirty) {
        snapshot = [];
        if (me) snapshot.push({ peer: me, presence: myPres, isMe: true, sameTab: true, kind: 'viewer' });
        for (const [peer, presence] of others) snapshot.push({ peer, presence, isMe: false, sameTab: false, kind: 'viewer' });
        dirty = false;
      }
      return snapshot;
    },
    presence(patch) {
      const next = { ...myPres };
      for (const k in patch) { if (patch[k] === null) delete next[k]; else next[k] = patch[k]; }
      myPres = next; dirty = true;
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'p', d: patch }));
      return Promise.resolve();
    },
  };
}

(async () => {
  try {
    if (window.claude && window.claude.use) { // als claude.ai-Artifact
      const r = await window.claude.use('room');
      if (r) room = r;
    } else room = connectServer();
    if (room) room.presence({ name: myName, mode: 'lobby' }).catch(() => {});
  } catch (e) { room = null; }
})();

const viewers = () => room ? room.peers().filter(p => p.kind === 'viewer') : [];
function hostPeer() { const ps = viewers(); return ps.length ? ps.reduce((a, b) => a.peer < b.peer ? a : b) : null; }
function amHost() { const h = hostPeer(); return !h || (h.isMe && h.sameTab); }
const peerName = p => String((p.presence && p.presence.name) || 'Spieler').slice(0, 12);
const displayName = () => myName.trim() || 'Spieler';
const soloRace = () => !karts.some(k => k.human && k.remote);

// Kart-Zustand kompakt als Zahlenliste
const enc = k => [Math.round(k.x * 10) / 10, Math.round(k.y * 10) / 10, Math.round(k.a * 1000) / 1000, Math.round(k.speed),
  k.boost > 0 ? 1 : 0, k.lap, k.idx, k.finished ? 1 : 0, Math.round(k.finishTime * 100) / 100, k.hop > 0 ? 1 : 0, k.drifting ? k.driftDir : 0,
  k.small > 0 ? 1 : 0, k.spin > 0 ? 1 : 0, Math.round((k.z || 0) * 10) / 10, k.fall > 0 ? 1 : 0];

function applyRemote(k, s) {
  const v = s.map(Number);
  if (v.length < 13 || !v.every(Number.isFinite)) return;
  k.small = v[11] ? 1 : 0; k.spin = v[12] ? 1 : 0;
  k.z = v.length > 14 ? clamp(v[13], 0, 20) : 0; k.fall = v.length > 14 && v[14] ? 0.6 : 0;
  k.tx = clamp(v[0], 0, MAP); k.ty = clamp(v[1], 0, MAP); k.ta = v[2]; k.speed = clamp(v[3], -60, 260);
  k.boost = v[4] ? 0.2 : 0; k.lap = v[5] | 0; k.idx = clamp(v[6] | 0, 0, N - 1);
  k.finished = !!v[7]; k.finishTime = v[8]; k.hop = v[9] ? 0.1 : 0; k.drifting = !!v[10]; k.driftDir = Math.sign(v[10]);
  k.progress = k.lap * N + k.idx;
  if (!k.seen || Math.hypot(k.tx - k.x, k.ty - k.y) > 60) { k.x = k.tx; k.y = k.ty; k.a = k.moveA = k.ta; }
  k.seen = true;
}
function updateRemote(k, dt) { // zwischen zwei Nachrichten weiterrechnen und weich nachziehen
  if (!k.seen) return;
  k.spinVis = k.spin > 0 ? k.spinVis + dt * 14 : 0;
  k.tx += Math.cos(k.ta) * k.speed * dt; k.ty += Math.sin(k.ta) * k.speed * dt;
  const f = Math.min(1, dt * 10);
  k.x += (k.tx - k.x) * f; k.y += (k.ty - k.y) * f;
  k.a = wrapA(k.a + wrapA(k.ta - k.a) * f); k.moveA = k.a;
}

function sendPresence() {
  if (!room) return;
  const inRace = state !== 'menu' && player;
  const hosting = inRace && raceHost === myPeer;
  room.presence({
    name: displayName(),
    mode: state === 'countdown' || state === 'race' ? 'race' : state === 'finish' ? 'finish' : 'lobby',
    rid: inRace ? raceId : null,
    k: inRace ? enc(player) : null,
    b: hosting ? karts.filter(k => k.bot).map(enc) : null,
    race: hosting ? { id: raceId, grid: raceGrid, track: builtTrack, bots: botLevel } : null,
    track: trackIdx, bots: botLevel,
    ev: inRace ? outEvents.map(e => [e.ev.id, e.ev.t, e.ev.s]) : null,
    pr: inRace ? shells.map(s => [s.id, s.kind === 'red' ? 1 : 0, Math.round(s.x), Math.round(s.y), Math.round(s.vx), Math.round(s.vy)]) : null,
  }).catch(() => {});
}

function netTick(dt) {
  if (!room) return;
  const ps = room.peers(), byPeer = new Map(ps.map(p => [p.peer, p]));
  const me = ps.find(p => p.isMe && p.sameTab);
  if (me) myPeer = me.peer;
  // vom Host gestartetes Rennen übernehmen
  const h = hostPeer();
  if (h && !(h.isMe && h.sameTab) && (state === 'menu' || state === 'finish')) {
    const r = h.presence.race;
    if (r && typeof r.id === 'string' && r.id !== lastRaceId && Array.isArray(r.grid) && r.grid.includes(myPeer))
      startRace(r.id, r.grid.slice(0, MAX_KARTS).map(String), h.peer, r.track, r.bots);
    else if (Number.isInteger(h.presence.track) && h.presence.track !== trackIdx
             && h.presence.track >= 0 && h.presence.track < TRACKS.length) chooseTrack(h.presence.track);
    const hb = h.presence.bots;
    if (Number.isInteger(hb) && hb >= 0 && hb < BOT_LEVELS.length) botLevel = hb;
  }
  // Zustände der anderen Karts übernehmen
  for (const k of karts) {
    if (!k.remote) continue;
    const src = byPeer.get(k.peer);
    k.gone = !src;
    if (!src) continue;
    if (k.human) k.name = peerName(src);
    const pres = src.presence;
    if (pres.rid !== raceId) { if (k.seen) k.gone = true; continue; } // hat das Rennen verlassen
    if (pres === k.lastPres) continue;
    k.lastPres = pres;
    const s = k.bot ? (Array.isArray(pres.b) ? pres.b[k.botIdx] : null) : pres.k;
    if (Array.isArray(s)) applyRemote(k, s);
  }
  netItems(ps);
  sendT -= dt;
  if (sendT <= 0) { sendT = 0.05; sendPresence(); }
}

function startRace(id, grid, host, trk, lvl) {
  if (Number.isInteger(lvl) && lvl >= 0 && lvl < BOT_LEVELS.length) botLevel = lvl;
  const L = BOT_LEVELS[botLevel], botCount = Math.max(1, MAX_KARTS - grid.length - 1);
  trk = clamp(Number.isInteger(trk) ? trk : 0, 0, TRACKS.length - 1);
  trackIdx = trk;
  if (trk !== builtTrack) buildTrack(trk);
  raceId = lastRaceId = id; raceGrid = grid; raceHost = host;
  const hosting = host === myPeer;
  let botNo = 0;
  const slots = gridSlots();
  karts = SLOT_LOOK.map((d, i) => {
    const [idx, off] = slots[i], p = path[idx];
    const human = i < grid.length, mine = human && grid[i] === myPeer;
    return {
      name: mine ? displayName() : human ? 'Spieler' : d.bot, col: d.body, spr: d.spr,
      isPlayer: mine, human, bot: !human, botIdx: human ? -1 : botNo++,
      peer: human ? grid[i] : host, remote: human ? !mine : !hosting, gone: false, seen: false, lastPres: null,
      maxSpeed: human ? 150 : L.speed[0] + (L.speed[1] - L.speed[0]) * Math.min(1, botNo / botCount), rb: 1,
      turnMul: human ? 1 : L.turn, // starke Bots lenken so scharf wie ein driftender Mensch
      x: p.x + p.nx * off, y: p.y + p.ny * off, a: p.ang, moveA: p.ang, speed: 0,
      tx: 0, ty: 0, ta: 0, label: null,
      boost: 0, drifting: false, driftDir: 0, driftCharge: 0, hop: 0,
      lap: 0, idx, progress: idx, finished: false, finishTime: 0,
      laneOff: human ? 0 : off * 0.9 + (rnd() * 2 - 1) * 3, phase: rnd() * 6,
      slot: i, item: null, roll: 0, rollItem: null, itemDelay: 0, spin: 0, spinVis: 0, small: 0,
      z: 0, air: 0, airT: 1, fall: 0, onRamp: false,
    };
  });
  placeBoxes(); shells = []; remoteShells.clear(); peerPres.clear(); outEvents = []; zapFlash = 0; escMenu = false;
  player = karts.find(k => k.isPlayer);
  cam.a = player.a; placeCam(1);
  state = 'countdown'; countdown = 3.99; raceTime = 0; paused = false; msg = ''; msgT = 0; particles = [];
  finishDelay = 0; sendT = 0;
}

function hostStart() {
  let grid = [myPeer];
  if (room && myPeer !== 'local') {
    const others = viewers()
      .filter(p => !(p.isMe && p.sameTab) && ['lobby', 'finish'].includes(p.presence.mode))
      .sort((a, b) => a.peer < b.peer ? -1 : 1).slice(0, MAX_KARTS - 1);
    grid = [myPeer, ...others.map(p => p.peer)];
  }
  startRace(Math.random().toString(36).slice(2, 10), grid, myPeer, trackIdx, botLevel);
}

// Streckenwahl (nur der Host); im Menü wird die Vorschau kurz verzögert neu aufgebaut
let rebuildT = 0;
function chooseTrack(i) {
  trackIdx = (i + TRACKS.length) % TRACKS.length;
  if (state === 'menu') rebuildT = 0.3;
  sendT = 0;
}

// ===================== Steuerung =====================
function saveName() {
  try { localStorage.setItem('kart.name', myName); } catch (e) {}
  sendT = 0;
}
function editName(e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return false;
  if (e.code === 'Backspace') { myName = myName.slice(0, -1); saveName(); e.preventDefault(); return true; }
  if (e.key.length === 1 && /[\p{L}\p{N} _.-]/u.test(e.key)) {
    if (myName.length < 12) myName += e.key;
    saveName(); return true;
  }
  return false;
}
// Pausenmenü (Esc/P): allein wird dabei angehalten, im Mehrspieler läuft das Rennen weiter
let escMenu = false, pauseButtons = [];
function toggleEscMenu(open = !escMenu) {
  escMenu = open;
  if (soloRace()) paused = open;
}
// zurück ins Hauptmenü: Rennen verlassen, Mitspieler sehen das Kart verschwinden
function goToMenu() {
  escMenu = false; paused = false; optionsOpen = false; pausedByOptions = false;
  state = 'menu'; karts = []; player = null;
  shells = []; particles = []; remoteShells.clear(); outEvents = []; msgT = 0; sendT = 0;
  if (trackIdx !== builtTrack) buildTrack(trackIdx);
}
function pauseAction(id) {
  if (id === 'resume') toggleEscMenu(false);
  else if (id === 'restart') hostStart();
  else if (id === 'sound') toggleOptions();
  else if (id === 'menu') goToMenu();
}

// Ton-Optionen: TAB öffnet/schließt, ↑↓ wählen, ←→ ändern
let optionsOpen = false, optSel = 0, pausedByOptions = false;
const OPTIONS = [
  { label: 'Gesamtlautstärke', key: 'master' },
  { label: 'Motor', key: 'engine' },
  { label: 'Effekte', key: 'fx' },
  { label: 'Ton', key: 'mute' },
];
function toggleOptions() {
  optionsOpen = !optionsOpen;
  if (optionsOpen && !paused && soloRace() && (state === 'race' || state === 'countdown')) { paused = true; pausedByOptions = true; }
  if (!optionsOpen && pausedByOptions) { paused = false; pausedByOptions = false; }
}
function changeOption(i, dir) {
  const o = OPTIONS[i];
  if (o.key === 'mute') muted = !muted;
  else {
    snd[o.key] = Math.round(clamp(snd[o.key] + dir * 0.1, 0, 1) * 10) / 10;
    if (o.key === 'master' && muted && dir > 0) muted = false;
  }
  initAudio(); if (actx && actx.state === 'suspended') actx.resume();
  if (o.key !== 'engine') beep(660, 0.12, 'triangle', 0.08); // Hörprobe
  saveSound();
}
function optionsKey(e) {
  if (e.code === 'ArrowUp' || e.code === 'KeyW') optSel = (optSel + OPTIONS.length - 1) % OPTIONS.length;
  else if (e.code === 'ArrowDown' || e.code === 'KeyS') optSel = (optSel + 1) % OPTIONS.length;
  else if (['ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD', 'Enter', 'Space'].includes(e.code))
    changeOption(optSel, e.code === 'ArrowLeft' || e.code === 'KeyA' ? -1 : 1);
  else if (e.code === 'KeyM') { muted = !muted; saveSound(); }
  else if (e.code === 'Escape') toggleOptions();
}

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Backspace', 'Tab'].includes(e.code)) e.preventDefault();
  if (e.code === 'Tab' && !e.repeat) { toggleOptions(); return; }
  if (optionsOpen) { optionsKey(e); return; }
  if (state === 'menu' && editName(e)) return;
  if ((e.code === 'ArrowUp' || e.code === 'ArrowDown') && state === 'menu' && amHost())
    chooseBotLevel(botLevel + (e.code === 'ArrowUp' ? 1 : -1));
  if ((e.code === 'ArrowLeft' || e.code === 'ArrowRight') && (state === 'menu' || (state === 'finish' && finishDelay <= 0)) && amHost())
    chooseTrack(trackIdx + (e.code === 'ArrowLeft' ? -1 : 1));
  if (e.repeat) return;
  if ((e.code === 'KeyE' || e.code === 'KeyX') && state === 'race' && !paused && !escMenu && player && !player.finished) useItem(player);
  if (e.code === 'Enter') {
    initAudio(); if (actx && actx.state === 'suspended') actx.resume();
    if ((state === 'menu' || (state === 'finish' && finishDelay <= 0)) && amHost()) hostStart();
  }
  if ((e.code === 'KeyP' || e.code === 'Escape') && (state === 'race' || state === 'countdown')) toggleEscMenu();
  if (e.code === 'KeyH' && (escMenu || state === 'finish')) goToMenu();
  if (e.code === 'KeyR' && state !== 'menu' && soloRace() && amHost()) hostStart();
  if (e.code === 'KeyM' && state !== 'menu') { muted = !muted; saveSound(); }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// Touch: sobald einmal ein Finger das Spiel bedient hat, gibt das Kart automatisch Gas
let touchMode = matchMedia('(pointer: coarse)').matches;
const touchKeys = { left: false, right: false, drift: false, brake: false };

function playerInput() {
  if (optionsOpen || escMenu) return { gas: false, brake: false, steer: 0, drift: false };
  const brake = !!(keys.ArrowDown || keys.KeyS || touchKeys.brake);
  return {
    gas: !!(keys.ArrowUp || keys.KeyW || (touchMode && !brake)),
    brake,
    steer: (keys.ArrowRight || keys.KeyD || touchKeys.right ? 1 : 0) - (keys.ArrowLeft || keys.KeyA || touchKeys.left ? 1 : 0),
    drift: !!(keys.Space || keys.ShiftLeft || keys.ShiftRight || touchKeys.drift),
  };
}

// Computergegner: fahren den Wegpunkten hinterher und bremsen vor Kurven
function aiInput(k) {
  const L = BOT_LEVELS[botLevel];
  const look = k.speed > 100 ? 10 : 7;
  const tp = path[(k.idx + look) % N];
  // Spur: am Start bleibt jeder Bot in der Spur seines Startplatzes, erst nach und nach suchen
  // sich die Bots ihre Ideallinie (starke Bots fahren sauberer) und schlängeln etwas
  const settle = Math.min(1, raceTime / 10);
  let off = k.laneOff * (1 - (1 - L.line) * settle) + Math.sin(time * 0.5 + k.phase) * 10 * L.line * settle;
  if (L.pads && settle >= 1) { // auf ein Boost-Feld kurz voraus zusteuern
    const pad = pads.find(p => { const ahead = (p.i - k.idx + N) % N; return ahead > 2 && ahead < 28; });
    if (pad) off = pad.off;
  }
  // nicht auffahren: steht jemand knapp vor mir in meiner Spur, weiche ich zur freieren Seite aus
  const hx = Math.cos(k.a), hy = Math.sin(k.a);
  for (const o of karts) {
    if (o === k || o.gone) continue;
    const dx = o.x - k.x, dy = o.y - k.y, ahead = dx * hx + dy * hy, side = dx * -hy + dy * hx;
    if (ahead > 0 && ahead < 36 && Math.abs(side) < 11) { off += side > 0 ? -15 : 15; break; }
  }
  off = clamp(off, -ROAD / 2 + 8, ROAD / 2 - 8);
  const desired = Math.atan2(tp.y + tp.ny * off - k.y, tp.x + tp.nx * off - k.x);
  const d = wrapA(desired - k.a);
  // Gummiband gegenüber dem besten Menschen: wer weit vorne ist, wird langsamer – wer hinten liegt,
  // holt umso stärker auf, je größer der Rückstand ist
  const best = Math.max(...karts.filter(o => o.human && !o.gone).map(o => o.progress), player.progress);
  const gap = k.progress - best;
  k.rb = k.isPlayer ? 1 : gap > N / 3 ? L.slowAhead : 1 + Math.min(L.catchUp, Math.max(0, -gap - N * 0.02) / N * L.catchRate);
  const c = Math.abs(wrapA(path[(k.idx + 14) % N].ang - path[(k.idx + 2) % N].ang));
  const target = k.maxSpeed * k.rb * (1 - Math.min(0.4, c * L.corner));
  // Mini-Turbo am Kurvenausgang, wie beim Driften
  if (!k.isPlayer) {
    if (c > 0.6) k.curvy = true;
    else if (k.curvy && c < 0.25) { k.curvy = false; if (Math.random() < L.turbo) k.boost = Math.max(k.boost, L.turboLen); }
  }
  return { gas: k.speed < target, brake: k.speed > target + 20, steer: clamp(d * 2.5, -1, 1), drift: false };
}

// ===================== Physik =====================
function updateKart(k, inp, dt) {
  if (k.fall > 0) { // abgestürzt: kurz warten, dann vor der Schanze wieder einsetzen
    k.fall -= dt; k.speed = 0; k.z = 0;
    if (k.fall <= 0) respawnKart(k);
    return;
  }
  if (k.air > 0) { // in der Luft: keine Lenkung, das Tempo bleibt erhalten
    k.air -= dt;
    const t = 1 - Math.max(0, k.air) / k.airT;
    k.z = 48 * t * (1 - t); // Flugbahn, höchstens 12 Einheiten hoch
    k.x += Math.cos(k.moveA) * k.speed * dt; k.y += Math.sin(k.moveA) * k.speed * dt;
    if (k.boost > 0) k.boost -= dt;
    if (k.air <= 0) {
      k.z = 0;
      if (surfaceAt(k.x, k.y) === 4) startFall(k);
      else if (k.isPlayer) beep(140, 0.12, 'square', 0.06);
    }
    return;
  }
  const surf = surfaceAt(k.x, k.y);
  if (surf === 4) { startFall(k); return; }
  // Absprung, sobald man die Schanze verlässt – wer zu langsam ist, landet im Abgrund
  if (surf === 3) k.onRamp = true;
  else if (k.onRamp) {
    k.onRamp = false;
    if (k.speed > 40) {
      const hill = jumps.some(j => j.hill && Math.min(Math.abs(k.idx - j.at), N - Math.abs(k.idx - j.at)) < 8);
      k.airT = k.air = hill ? 0.15 + k.speed / 700 : 0.3 + k.speed / 350; k.drifting = false;
      if (k.isPlayer) beep(520, 0.25, 'triangle', 0.06);
    }
  }
  if (surf === 2) { if (k.boost <= 0 && k.isPlayer) beep(660, 0.25, 'sawtooth', 0.05); k.boost = Math.max(k.boost, 1.0); }
  if (k.spin > 0) { // getroffen: dreht sich, keine Kontrolle
    k.spin -= dt; k.spinVis += dt * 14;
    inp = { gas: false, brake: false, steer: 0, drift: false };
    k.speed -= Math.sign(k.speed) * Math.min(Math.abs(k.speed), 120 * dt);
  } else k.spinVis = 0;
  if (k.small > 0) k.small -= dt;
  const size = k.small > 0 ? 0.7 : 1;

  let max = k.maxSpeed * k.rb * size;
  if (k.boost > 0) { max = k.maxSpeed * 1.45 * size; k.boost -= dt; }
  else if (surf === 0) max = OFFROAD_MAX * size;

  if (inp.gas) k.speed += ACC * (k.boost > 0 ? 2.5 : 1) * dt;
  else if (inp.brake) k.speed -= (k.speed > 0 ? BRAKE : 60) * dt;
  else k.speed -= Math.sign(k.speed) * Math.min(Math.abs(k.speed), FRICTION * dt);
  if (k.speed > max) k.speed = Math.max(max, k.speed - 160 * dt);
  if (k.speed < -45) k.speed = -45;

  // Drift: Taste halten + lenken; loslassen gibt einen Mini-Turbo
  if (inp.drift && !k.drifting && inp.steer !== 0 && k.speed > 70 && surf !== 0) {
    k.drifting = true; k.driftDir = Math.sign(inp.steer); k.driftCharge = 0; k.hop = 0.25;
  }
  if (k.drifting) {
    if (surf === 0 || k.speed < 40) k.drifting = false;
    else if (!inp.drift) {
      if (k.driftCharge > 1.4) { k.boost = Math.max(k.boost, 1.1); if (k.isPlayer) beep(880, 0.3, 'sawtooth', 0.06); }
      else if (k.driftCharge > 0.7) { k.boost = Math.max(k.boost, 0.6); if (k.isPlayer) beep(620, 0.2, 'sawtooth', 0.05); }
      k.drifting = false;
    } else {
      const s = inp.steer * k.driftDir;
      k.a += k.driftDir * TURN * (0.75 + 0.5 * s) * dt;
      k.driftCharge += dt * (0.8 + 0.6 * Math.max(0, s));
    }
  }
  if (!k.drifting) k.a += inp.steer * TURN * (k.turnMul || 1) * Math.min(1, Math.abs(k.speed) / 50) * Math.sign(k.speed) * dt;
  k.a = wrapA(k.a);

  const grip = k.drifting ? 4 : 12;
  k.moveA = wrapA(k.moveA + wrapA(k.a - k.moveA) * Math.min(1, grip * dt));
  k.x += Math.cos(k.moveA) * k.speed * dt;
  k.y += Math.sin(k.moveA) * k.speed * dt;
  if (k.hop > 0) k.hop -= dt;
}

function collide() {
  // nur selbst simulierte Karts werden verschoben; fremde gelten als feste Hindernisse
  for (let i = 0; i < karts.length; i++) for (let j = i + 1; j < karts.length; j++) {
    const a = karts[i], b = karts[j];
    if (a.gone || b.gone || (a.remote && b.remote)) continue;
    if ((a.z || 0) > 3 || (b.z || 0) > 3 || a.fall > 0 || b.fall > 0) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d > 0 && d < 10) {
      const o = 10 - d, nx = dx / d, ny = dy / d;
      const wa = a.remote ? 0 : b.remote ? 1 : 0.5, wb = 1 - wa;
      a.x -= nx * o * wa; a.y -= ny * o * wa; b.x += nx * o * wb; b.y += ny * o * wb;
      const av = a.speed, bv = b.speed;
      if (!(a.bot && b.bot)) { // Bots untereinander schubsen sich nur zur Seite
        if (!a.remote) a.speed = av * 0.88 + bv * 0.08;
        if (!b.remote) b.speed = bv * 0.88 + av * 0.08;
      }
      if (a.isPlayer || b.isPlayer) beep(180, 0.08, 'square', 0.05);
      // geschrumpfte Karts werden von normal großen plattgefahren
      if (!a.remote && a.small > 0 && !(b.small > 0) && a.spin <= 0) spinOut(a);
      if (!b.remote && b.small > 0 && !(a.small > 0) && b.spin <= 0) spinOut(b);
    }
  }
  for (const k of karts) {
    if (k.remote || (k.z || 0) > 3 || k.fall > 0) continue;
    for (const t of trees) {
      const dx = k.x - t.x, dy = k.y - t.y, d = Math.hypot(dx, dy);
      if (d > 0 && d < 10) {
        k.x = t.x + dx / d * 10; k.y = t.y + dy / d * 10; k.speed *= 0.3; k.drifting = false;
        if (k.isPlayer) beep(110, 0.15, 'square', 0.08);
      }
    }
    const nx = clamp(k.x, 10, MAP - 10), ny = clamp(k.y, 10, MAP - 10);
    if (nx !== k.x || ny !== k.y) { k.x = nx; k.y = ny; k.speed *= 0.5; }
  }
}

function updateProgress(k) {
  let best = k.idx, bd = Infinity;
  for (let j = -20; j <= 20; j++) {
    const i = (k.idx + j + N) % N, p = path[i], d = (p.x - k.x) ** 2 + (p.y - k.y) ** 2;
    if (d < bd) { bd = d; best = i; }
  }
  const diff = best - k.idx;
  if (diff < -N / 2) {
    k.lap++;
    if (k.lap > lapsNow() && !k.finished) {
      k.finished = true; k.finishTime = raceTime;
    } else if (k.isPlayer && k.lap >= 2) {
      msg = k.lap === lapsNow() ? 'LETZTE RUNDE!' : 'RUNDE ' + k.lap; msgT = 2;
      beep(k.lap === lapsNow() ? 990 : 770, 0.35, 'triangle', 0.1);
    }
  } else if (diff > N / 2) k.lap--;
  k.idx = best;
  k.progress = k.lap * N + best;
}

function ranking() {
  return karts.filter(k => !k.gone).sort((a, b) => {
    if (a.finished && b.finished) return a.finishTime - b.finishTime;
    if (a.finished !== b.finished) return a.finished ? -1 : 1;
    return b.progress - a.progress;
  });
}

// ===================== Power-ups =====================
// Pilz = Turbo, grüner Panzer prallt an den Streckenrändern ab, roter Panzer jagt das Kart vor dir,
// Blitz lässt alle anderen schrumpfen. Treffer und Blitze werden als Ereignisse an alle verteilt;
// jeder wendet sie nur auf die Karts an, die er selbst simuliert.
const ITEMS = ['mushroom', 'green', 'red', 'lightning'];
const ITEM_ODDS = [ // Gewichte je Platzierung (1. bis 4.): Pilz, grüner, roter Panzer, Blitz
  [40, 50, 10, 0],
  [35, 30, 30, 5],
  [35, 15, 38, 12],
  [35, 5, 38, 22],
];
let boxes = [], shells = [], remoteShells = new Map(), peerPres = new Map();
let outEvents = [], seenEvents = new Set(), evCounter = 0, zapFlash = 0;

function placeBoxes() {
  boxes = [];
  for (const f of [0.2, 0.45, 0.7, 0.9]) {
    let i = Math.floor(N * f);
    if (pads.some(p => Math.abs(p.i - i) < 8) || jumps.some(j => Math.abs(j.at - i) < 16)) i = (i + 20) % N;
    const p = path[i];
    for (const off of [-24, -8, 8, 24]) {
      const o = off * ROAD / 84;
      boxes.push({ x: p.x + p.nx * o, y: p.y + p.ny * o, respawn: 0 });
    }
  }
}

function nearestIdx(idx, x, y) {
  let best = idx, bd = Infinity;
  for (let j = -20; j <= 20; j++) {
    const i = (idx + j + N) % N, p = path[i], d = (p.x - x) ** 2 + (p.y - y) ** 2;
    if (d < bd) { bd = d; best = i; }
  }

}

function rollItem(k) {
  const rk = ranking(); // Platzierung auf die 4 Stufen (vorne … hinten) umrechnen
  const w = ITEM_ODDS[Math.min(3, Math.floor(Math.max(0, rk.indexOf(k)) / Math.max(1, rk.length) * 4))];
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < ITEMS.length; i++) if ((r -= w[i]) < 0) return ITEMS[i];
  return 'mushroom';
}

function updateBoxes(dt) {
  for (const b of boxes) {
    if (b.respawn > 0) { b.respawn -= dt; continue; }
    for (const k of karts) {
      if (k.remote || k.gone || (k.x - b.x) ** 2 + (k.y - b.y) ** 2 > 11 ** 2) continue;
      b.respawn = 3;
      if (!k.item && k.roll <= 0) {
        const iw = BOT_LEVELS[botLevel].itemWait;
        k.roll = 1.2; k.rollItem = rollItem(k); k.itemDelay = iw[0] + Math.random() * (iw[1] - iw[0]);
        if (k.isPlayer) beep(990, 0.08, 'square', 0.05);
      }

    }
  }
  for (const k of karts) {
    if (k.roll > 0 && (k.roll -= dt) <= 0) { k.item = k.rollItem; if (k.isPlayer) beep(1320, 0.12, 'triangle', 0.07); }
  }
}

function useItem(k) {
  const it = k.item;

  k.item = null;
  const fx = Math.cos(k.a), fy = Math.sin(k.a);
  if (it === 'mushroom') {
    k.boost = Math.max(k.boost, 1.3); k.speed = Math.max(k.speed, k.maxSpeed);
    if (k.isPlayer) beep(520, 0.3, 'sawtooth', 0.06);
  } else if (it === 'green' || it === 'red') {
    const sp = Math.max(260, k.speed + 120);
    let target = -1;
    if (it === 'red') { const r = ranking(), i = r.indexOf(k); if (i > 0) target = r[i - 1].slot; }
    shells.push({ id: myPeer + '-s' + (++evCounter), kind: it, x: k.x + fx * 12, y: k.y + fy * 12,
      vx: fx * sp, vy: fy * sp, sp, owner: k.slot, target, idx: k.idx, life: it === 'red' ? 10 : 8, grace: 0.5 });
    if (k.isPlayer) beep(it === 'red' ? 320 : 240, 0.15, 'triangle', 0.07);

}

function updateShells(dt) {
  for (const s of shells) {
    s.life -= dt; s.grace -= dt;
    s.idx = nearestIdx(s.idx, s.x, s.y);
    if (s.kind === 'red') {
      // folgt dem Streckenverlauf, auf den letzten Metern direkt aufs Ziel
      const t = s.target >= 0 ? karts[s.target] : null;
      let tx, ty;
      if (t && !t.gone && (t.x - s.x) ** 2 + (t.y - s.y) ** 2 < 160 ** 2) { tx = t.x; ty = t.y; }
      else { const p = path[(s.idx + 5) % N]; tx = p.x; ty = p.y; }
      const d = Math.hypot(tx - s.x, ty - s.y) || 1;
      s.vx = (tx - s.x) / d * s.sp; s.vy = (ty - s.y) / d * s.sp;
      s.x += s.vx * dt; s.y += s.vy * dt;
    } else {

      const p = path[s.idx];
      let ox = s.x - p.x, oy = s.y - p.y; const ol = Math.hypot(ox, oy) || 1; ox /= ol; oy /= ol;
      const dot = s.vx * ox + s.vy * oy;
      if ((surfaceAt(nx, ny) === 0 || (theme.voidOff && surfaceAt(nx, ny) === 4)) && dot > 0) { s.vx -= 2 * dot * ox; s.vy -= 2 * dot * oy; } // an der Kante abprallen
      else { s.x = nx; s.y = ny; }
    }
    for (const k of karts) {
      if (k.gone || (k.slot === s.owner && s.grace > 0)) continue;
      if ((k.x - s.x) ** 2 + (k.y - s.y) ** 2 < 9 ** 2) { fireEvent({ t: 'hit', s: k.slot }); s.life = 0; break; }
    }
  }

}

function aiItems(k, dt) {
  if (!k.item || k.finished || (k.itemDelay -= dt) > 0) return;
  const pos = ranking().indexOf(k);
  if (botLevel === 0 && Math.random() < 0.5) { k.itemDelay = 2; return; } // leichte Bots trödeln
  const straight = Math.abs(wrapA(path[(k.idx + 15) % N].ang - path[k.idx].ang)) < 0.25;
  if ((k.item === 'mushroom' && straight) || (k.item === 'green' && straight)
      || (k.item === 'red' && pos > 0) || (k.item === 'lightning' && pos > 0) || k.itemDelay < -6) useItem(k);
}

function startFall(k) {
  k.fall = 1.3; k.air = 0; k.z = 0; k.drifting = false; k.boost = 0; k.speed = 0; k.onRamp = false;
  if (k.isPlayer) { beep(320, 0.5, 'sawtooth', 0.07); beep(110, 0.6, 'square', 0.05); msg = 'ABSTURZ!'; msgT = 1.2; }
}
// nach einem Absturz: vor der Schanze (oder knapp hinter der Absturzstelle) mit Tempo 0 wieder einsetzen
function respawnKart(k) {
  let idx = (k.idx - 4 + N) % N;
  for (const j of jumps) if (!j.hill && (k.idx - j.ramp + N) % N < 30) idx = (j.ramp - 10 + N) % N;
  if (idx - k.idx > N / 2) k.lap--; // zurück über die Ziellinie gesetzt
  const p = path[idx];
  k.x = p.x; k.y = p.y; k.a = k.moveA = p.ang; k.speed = 0; k.spin = 0;
  k.idx = idx; k.progress = k.lap * N + idx;
}

function spinOut(k) {
  k.spin = 1.1; k.speed *= 0.25; k.drifting = false; k.boost = 0;
  if (k.isPlayer) beep(150, 0.4, 'sawtooth', 0.09);
}
function fireEvent(ev) {
  ev.id = myPeer + '-e' + (++evCounter);
  seenEvents.add(ev.id);
  outEvents.push({ ev, until: time + 2 });
  applyEvent(ev);
}
function applyEvent(ev) {
  if (ev.t === 'hit') {
    const k = karts[ev.s];
    if (k && !k.remote) spinOut(k);
    else if (k) beep(200, 0.1, 'square', 0.04);
  } else if (ev.t === 'zap') {
    zapFlash = 0.5;
    beep(1600, 0.35, 'sawtooth', 0.06); beep(220, 0.5, 'square', 0.05);
    for (const k of karts) {
      if (k.slot === ev.s || k.remote || k.gone) continue;
      k.small = 6; k.spin = Math.max(k.spin, 0.5); k.speed *= 0.5; k.item = null; k.roll = 0;
    }
  }
}
// Ereignisse und Panzer der anderen Spieler übernehmen
function netItems(ps) {
  for (const p of ps) {
    if (p.isMe && p.sameTab) continue;
    const pres = p.presence;
    if (peerPres.get(p.peer) === pres) continue;
    peerPres.set(p.peer, pres);
    if (pres.rid !== raceId || !karts.length) { remoteShells.delete(p.peer); continue; }
    for (const e of Array.isArray(pres.ev) ? pres.ev : []) {
      if (!Array.isArray(e) || typeof e[0] !== 'string' || seenEvents.has(e[0])) continue;
      const s = Number(e[2]);
      if (!(e[1] === 'hit' || e[1] === 'zap') || !Number.isInteger(s) || s < 0 || s >= MAX_KARTS) continue;
      seenEvents.add(e[0]);
      applyEvent({ id: e[0], t: e[1], s });
    }
    const list = (Array.isArray(pres.pr) ? pres.pr : []).slice(0, 12)
      .map(a => Array.isArray(a) ? a.map(Number) : []).filter(a => a.length >= 6 && a.slice(1).every(Number.isFinite));
    remoteShells.set(p.peer, { t: time, list });
  }
  if (seenEvents.size > 2000) seenEvents = new Set();
  for (const peer of [...remoteShells.keys()]) if (!ps.some(p => p.peer === peer)) remoteShells.delete(peer);
}

function placeCam(dt) {
  if (state === 'menu') {
    const c = path[N - 5];
    cam.a = time * 0.25;
    cam.x = c.x - Math.cos(cam.a) * 75; cam.y = c.y - Math.sin(cam.a) * 75;
    return;
  }
  cam.a = wrapA(cam.a + wrapA(player.moveA - cam.a) * Math.min(1, dt * 5));
  cam.x = player.x - Math.cos(cam.a) * CAM_DIST;
  cam.y = player.y - Math.sin(cam.a) * CAM_DIST;
}

function update(dt) {
  time += dt;
  netTick(dt);
  if (rebuildT > 0 && (rebuildT -= dt) <= 0 && state === 'menu' && trackIdx !== builtTrack) buildTrack(trackIdx);
  if (msgT > 0) msgT -= dt;
  if (zapFlash > 0) zapFlash -= dt;
  if (!paused) {
    if (state === 'countdown') {
      const before = Math.ceil(countdown);
      countdown -= dt;
      const after = Math.ceil(countdown);
      if (after !== before && after < 4) beep(after > 0 ? 440 : 880, after > 0 ? 0.15 : 0.45, 'square', 0.09);
      if (countdown <= 0) { state = 'race'; msg = 'LOS!'; msgT = 1; }
    }
    if (state === 'race' || state === 'finish') {
      raceTime += dt;
      for (const k of karts) {
        if (k.gone) continue;
        if (k.remote) updateRemote(k, dt);
        else {
          updateKart(k, (k.isPlayer && !k.finished) ? playerInput() : aiInput(k), dt);
          if (!k.isPlayer) aiItems(k, dt);
        }
      }
      updateBoxes(dt);
      updateShells(dt);
      outEvents = outEvents.filter(e => e.until > time);
      collide();
      for (const k of karts) if (!k.remote) updateProgress(k);
      if (state === 'race' && player.finished) {
        state = 'finish'; finishDelay = 1.5;
        if (amHost()) chooseTrack(builtTrack + 1); // nächstes Rennen automatisch auf der nächsten Strecke
        const pos = ranking().indexOf(player) + 1;
        [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.3, 'triangle', 0.1), i * 140 * (pos === 1 ? 1 : 1.6)));
      }
      if (finishDelay > 0) finishDelay -= dt;
    }
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * RS * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
  }
  placeCam(dt);

  updateEngineSound(dt);
}

// ===================== Rendering =====================
function renderFloor() {
  const fx = Math.cos(cam.a), fy = Math.sin(cam.a), rx = -fy, ry = fx;
  const OUT = OUTSIDE;
  for (let y = HORIZON + 1; y < H; y++) {
    const z = CAM_H * FOCAL / (y - HORIZON), s = z / FOCAL; // s = Welteinheiten pro Bildschirmpixel
    let wx = cam.x + fx * z - rx * s * W / 2, wy = cam.y + fy * z - ry * s * W / 2;
    const dx = rx * s, dy = ry * s;
    let o = y * W;
    if (s < 0.9) {
      // nah: zwischen vier Texeln weich überblenden statt Blöcke zu zeigen
      const M = MAP, tb = texBuf;
      for (let x = 0; x < W; x++) {
        const fu = wx - 0.5, fv = wy - 0.5, u = Math.floor(fu), v = Math.floor(fv);
        if (u < 0 || v < 0 || u >= M - 1 || v >= M - 1) buf[o++] = OUT;
        else {
          const ax = fu - u, ay = fv - v, i = v * M + u;
          const c00 = tb[i], c10 = tb[i + 1], c01 = tb[i + M], c11 = tb[i + M + 1];
          const w00 = (1 - ax) * (1 - ay), w10 = ax * (1 - ay), w01 = (1 - ax) * ay, w11 = ax * ay;
          const r = (c00 & 255) * w00 + (c10 & 255) * w10 + (c01 & 255) * w01 + (c11 & 255) * w11;
          const g = (c00 >> 8 & 255) * w00 + (c10 >> 8 & 255) * w10 + (c01 >> 8 & 255) * w01 + (c11 >> 8 & 255) * w11;
          const b = (c00 >> 16 & 255) * w00 + (c10 >> 16 & 255) * w10 + (c01 >> 16 & 255) * w01 + (c11 >> 16 & 255) * w11;
          buf[o++] = 0xff000000 | (b << 16) | (g << 8) | r;
        }
        wx += dx; wy += dy;
      }
    } else {
      // fern: passende verkleinerte Textur, damit nichts flimmert
      const lvl = s < 2.5 ? 0 : s < 5 ? 1 : 2, tb = mips[lvl], M = MAP >> lvl, k = 1 / (1 << lvl);
      for (let x = 0; x < W; x++) {
        const u = Math.floor(wx * k), v = Math.floor(wy * k);
        buf[o++] = (u >= 0 && u < M && v >= 0 && v < M) ? tb[v * M + u] : OUT;
        wx += dx; wy += dy;
      }
    }
  }
}

// Sprites für Item-Boxen und Panzer
const [boxImg, boxG] = hiCanvas(20, 20);
{
  const g = boxG;
  g.fillStyle = '#fff'; g.fillRect(0, 0, 20, 20);
  const gr = g.createLinearGradient(0, 0, 20, 20);
  gr.addColorStop(0, '#ff5fd2'); gr.addColorStop(0.5, '#4fc3ff'); gr.addColorStop(1, '#ffe14d');
  g.fillStyle = gr; g.fillRect(2, 2, 16, 16);
  g.fillStyle = '#fff'; g.font = 'bold 15px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('?', 10, 11);
}
function shellSprite(col, dark) {

  g.fillStyle = '#f4f4f4'; g.fillRect(1, 7, 14, 3);

}
const SHELL_IMG = { green: shellSprite('#2fbf4a', '#1b7a2c'), red: shellSprite('#e53935', '#8e1b18') };

function render() {

  }

    for (const s of shells) { const p = project(s.x, s.y); if (p) list.push({ ...p, shell: SHELL_IMG[s.kind] }); }
    for (const { t, list: rl } of remoteShells.values()) for (const a of rl) {

      if (p) list.push({ ...p, shell: a[1] ? SHELL_IMG.red : SHELL_IMG.green });
    }
  }

      vctx.drawImage(im, s.sx - w / 2, s.sy - h, w, h);
      continue;
    }
    if (s.box) { // schwebend und sich drehend
      const w = 9 * s.sc, spinW = w * Math.max(0.25, Math.abs(Math.cos(time * 2.5))), bob = (3 + Math.sin(time * 4) * 1.2) * s.sc;
      vctx.drawImage(boxImg, s.sx - spinW / 2, s.sy - w - bob, spinW, w);
      continue;
    }
    if (s.shell) {
      const w = 6 * s.sc, h = w * 12 / 16;
      vctx.drawImage(s.shell, s.sx - w / 2, s.sy - h, w, h);
      continue;
    }
    const k = s.k;
    const rel = wrapA(k.a + k.spinVis - Math.atan2(k.y - cam.y, k.x - cam.x));
    let im = k.spr.back, flip = false, rot = 0;
    if (Math.abs(rel) > 2.4) im = k.spr.front;
    else if (Math.abs(rel) > 0.7) { im = k.spr.side; flip = rel < 0; }
    else rot = clamp(rel * 0.6, -0.3, 0.3);
    const fallScale = k.fall > 0 ? Math.max(0.1, k.fall / 1.3) : 1; // beim Absturz verschwindet das Kart in der Tiefe
    const w = im.width / SS / PXU * s.sc * (k.small > 0 ? 0.55 : 1) * fallScale, h = w * im.height / im.width;
    const lift = (k.hop > 0 ? Math.sin((0.25 - k.hop) / 0.25 * Math.PI) * 2.5 : 0) * s.sc + (k.z || 0) * s.sc;
    if ((k.z || 0) > 0.5) { // Schatten bleibt am Boden
      vctx.fillStyle = 'rgba(0,0,0,.3)'; vctx.beginPath(); vctx.ellipse(s.sx, s.sy - 0.5 * s.sc, w * 0.42, w * 0.08, 0, 0, 7); vctx.fill();
    }
    vctx.save(); vctx.translate(s.sx, s.sy - lift); vctx.rotate(rot); if (flip) vctx.scale(-1, 1);
    vctx.drawImage(im, -w / 2, -h, w, h);
    vctx.restore();
    if (k.human && !k.isPlayer) k.label = { x: s.sx, y: s.sy - lift - h };

    // Turbo-Flamme
    if (k.boost > 0 && im === k.spr.back) {
      for (const ex of [-1.7, 1.7]) {
        const r = s.sc * (1.1 + Math.random() * 0.7);
        vctx.fillStyle = '#ff7a00'; vctx.beginPath(); vctx.arc(s.sx + ex * s.sc, s.sy - lift - h * 0.17, r * 1.4, 0, 7); vctx.fill();
        vctx.fillStyle = '#ffe14d'; vctx.beginPath(); vctx.arc(s.sx + ex * s.sc, s.sy - lift - h * 0.17, r * 0.7, 0, 7); vctx.fill();
      }
    }
    // Funken beim Driften / Staub im Gras
    if (k.isPlayer && state !== 'menu' && !paused) {
      if (k.drifting) {
        const col = k.driftCharge > 1.4 ? '#ff9a1f' : k.driftCharge > 0.7 ? '#3fb8ff' : '#e8e8e8';
        for (const wx of [-4.5, 4.5]) particles.push({
          x: s.sx + wx * s.sc, y: s.sy - 1, vx: ((wx > 0 ? 1 : -1) * (10 + Math.random() * 30) - k.driftDir * 15) * RS,
          vy: (-20 - Math.random() * 30) * RS, life: 0.25 + Math.random() * 0.15, col, size: (1 + Math.random() * 1.5) * RS,
        });
      } else if (surfaceAt(k.x, k.y) === 0 && Math.abs(k.speed) > 30) {
        particles.push({ x: s.sx + (Math.random() - 0.5) * w, y: s.sy - 1, vx: (Math.random() - 0.5) * 40 * RS,
          vy: (-15 - Math.random() * 20) * RS, life: 0.35, col: '#8a6a3a', size: (2 + Math.random() * 2) * RS });
      }
    }
  }
  for (const p of particles) { vctx.fillStyle = p.col; vctx.fillRect(p.x, p.y, p.size, p.size); }
  if (zapFlash > 0) { vctx.fillStyle = `rgba(255,255,220,${Math.min(0.8, zapFlash * 1.6)})`; vctx.fillRect(0, 0, W, H); }

  // hochskalieren + HUD in voller Auflösung
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(view, 0, 0, OW, OH);
  drawHud();
}

function txt(s, x, y, size, align = 'left', fill = '#fff') {
  ctx.font = `italic 900 ${size}px "Segoe UI", system-ui, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(4, size / 6); ctx.strokeStyle = '#111'; ctx.strokeText(s, x, y);
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}

function drawItemIcon(kind, cx, cy, s) {

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render(); syncTouchUi();
  requestAnimationFrame(frame);
}

// ===================== Touch-Bedienung (Handy/Tablet) =====================
const touchEl = document.getElementById('touch'), nameInput = document.getElementById('name-input');
function syncTouchUi() {
  if (touchEl.hidden === touchMode) touchEl.hidden = !touchMode;
  syncIosHint();
  syncRoomUi();
  const r = state === 'race' || state === 'countdown' ? '1' : '0';
  if (touchEl.dataset.race !== r) touchEl.dataset.race = r;
  const f = fsSupported() && !fsActive() ? '1' : '0';
  if (touchEl.dataset.full !== f) touchEl.dataset.full = f;
  // Start-Knopf nur für den Host, im Menü und nach dem Ziel
  const st = !optionsOpen && amHost() && (state === 'menu' || (state === 'finish' && finishDelay <= 0)) ? '1' : '0';
  if (touchEl.dataset.start !== st) {
    touchEl.dataset.start = st;
    startBtn.textContent = state === 'finish' ? '▶ NÄCHSTES RENNEN' : '▶ RENNEN STARTEN';
  }
}
// iPhone/iPad (iPads melden sich teils als Mac mit Touchscreen)
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const iosHint = document.getElementById('ios-hint');
let iosHintClosed = false;
try { iosHintClosed = localStorage.getItem('kart.iosHint') === 'zu'; } catch (e) {}
document.getElementById('ios-hint-close').addEventListener('click', () => {
  iosHintClosed = true;
  try { localStorage.setItem('kart.iosHint', 'zu'); } catch (e) {}
});
function syncIosHint() {
  const show = isIOS && !isStandalone() && !iosHintClosed && state === 'menu' && !optionsOpen;
  if (iosHint.hidden === show) iosHint.hidden = !show;
}
function wake() { initAudio(); if (actx && actx.state === 'suspended') actx.resume(); }

// Vollbild: Browser erlauben das nur direkt aus einem Antippen heraus ("click", nicht schon beim
// Aufsetzen des Fingers). iPhones kennen kein Vollbild für Webseiten – dort hilft "Zum Home-Bildschirm".
const fsSupported = () => !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
const fsActive = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
const isStandalone = () => matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches || navigator.standalone === true;
function goFullscreen() {
  if (fsActive() || !fsSupported() || isStandalone()) return;
  const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
  try {
    Promise.resolve(req.call(el, { navigationUI: 'hide' }))
      .then(() => screen.orientation && screen.orientation.lock ? screen.orientation.lock('landscape') : null)
      .catch(() => {});
  } catch (e) {}
}

const startBtn = document.getElementById('t-start');
startBtn.addEventListener('click', () => {
  wake(); goFullscreen();
  if (amHost() && (state === 'menu' || (state === 'finish' && finishDelay <= 0))) hostStart();
});
document.getElementById('t-full').addEventListener('click', () => { wake(); goFullscreen(); });

// Halte-Knöpfe; mehrere Knöpfe können dieselbe Aktion auslösen (DRIFT gibt es links und rechts)
const heldButtons = {};
function holdButton(id, key) {
  const b = document.getElementById(id);
  const set = v => {
    heldButtons[id] = v; b.classList.toggle('on', v);
    touchKeys[key] = Object.keys(heldButtons).some(k => heldButtons[k] && document.getElementById(k).dataset.key === key);
  };
  b.dataset.key = key;
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); set(true); wake();
    try { b.setPointerCapture(e.pointerId); } catch (err) {} // Finger darf vom Knopf rutschen
  });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, () => set(false));
}
holdButton('t-left', 'left'); holdButton('t-right', 'right');
holdButton('t-drift-l', 'drift'); holdButton('t-drift-r', 'drift'); holdButton('t-brake', 'brake');
document.getElementById('t-item').addEventListener('pointerdown', e => {
  e.preventDefault();
  if (state === 'race' && !paused && !escMenu && player && !player.finished) useItem(player);
});
document.getElementById('t-menu').addEventListener('pointerdown', e => { e.preventDefault(); wake(); toggleOptions(); });
document.getElementById('t-pause').addEventListener('pointerdown', e => { e.preventDefault(); toggleEscMenu(); });

// Antippen bzw. Anklicken im Menü, im Ziel und in den Ton-Optionen
function tapAt(x, y) {
  if (optionsOpen) {
    const bw = 620, bh = 360, bx = (OW - bw) / 2, by = (OH - bh) / 2;
    if (x < bx || x > bx + bw || y < by || y > by + bh) { toggleOptions(); return; }
    const i = Math.round((y - (by + 115)) / 56);
    if (i >= 0 && i < OPTIONS.length) { optSel = i; changeOption(i, x < bx + 420 ? -1 : 1); }
    return;
  }
  if (escMenu) {
    const b = pauseButtons.find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
    if (b) pauseAction(b.id);
    return;
  }
  if (state === 'finish' && finishDelay <= 0 && x < 330 && y > OH - 70) { goToMenu(); return; }
  const side = x < OW / 2 ? -1 : 1;
  if (state === 'menu') {
    if (y > 310 && y < 376 && amHost()) chooseTrack(trackIdx + side);
    else if (y >= 376 && y < 424 && amHost()) chooseBotLevel(botLevel + side);
    else if (y >= 424 && y < 482) { nameInput.value = myName; nameInput.focus(); }
    else if (y > 640 && amHost()) hostStart();
  } else if (state === 'finish' && finishDelay <= 0 && amHost()) {
    if (y > 545 && y < 600) chooseTrack(trackIdx + side);
    else if (y > 605) hostStart();
  }
}
out.addEventListener('pointerdown', e => {
  out.focus(); window.focus();
  if (e.pointerType === 'touch') touchMode = true;
});
// "click" statt "pointerdown": nur so öffnet sich am Handy die Tastatur für den Namen
out.addEventListener('click', e => {
  wake();
  const r = out.getBoundingClientRect();
  tapAt((e.clientX - r.left) / r.width * OW, (e.clientY - r.top) / r.height * OH);
});
// Name über die Bildschirmtastatur
nameInput.addEventListener('input', () => {
  myName = nameInput.value.replace(/[^\p{L}\p{N} _.-]/gu, '').slice(0, 12);
  saveName();
});
nameInput.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') nameInput.blur(); });

// ===================== Eigene Räume =====================
// "Eigener Raum" denkt sich einen Raumnamen aus, wechselt sofort hinein und teilt den Link
// (am Handy über das Teilen-Menü, am PC über die Zwischenablage).
const roomUi = document.getElementById('room-ui'), roomNameEl = document.getElementById('room-name');
const roomLobbyBtn = document.getElementById('room-lobby'), toastEl = document.getElementById('toast');
const ROOM_WORDS = ['turbo', 'blitz', 'drift', 'pilz', 'panzer', 'rakete', 'boost', 'kurve', 'piste', 'auspuff'];
let toastTimer = 0;

function newRoomName() {
  const abc = 'abcdefghjkmnpqrstuvwxyz23456789'; // ohne leicht verwechselbare Zeichen wie 0/o, 1/l/i
  let code = '';
  for (let i = 0; i < 4; i++) code += abc[Math.floor(Math.random() * abc.length)];
  return ROOM_WORDS[Math.floor(Math.random() * ROOM_WORDS.length)] + '-' + code;
}
const roomLink = () => location.origin + location.pathname + '?raum=' + roomLabel;

function showToast(text, link) {
  toastEl.textContent = text;
  if (link) {
    const inp = document.createElement('input');
    inp.readOnly = true; inp.value = link; inp.setAttribute('aria-label', 'Link zum Raum');
    toastEl.appendChild(inp);
    setTimeout(() => { inp.focus(); inp.select(); }, 0);
  }
  toastEl.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.hidden = true; }, link ? 9000 : 2600);
}

function joinRoom(name) {
  room.switchRoom(name);
  history.replaceState(null, '', location.pathname + (roomLabel === 'lobby' ? '' : '?raum=' + roomLabel));
  lastRaceId = null; sendT = 0;
}

// muss direkt im Klick passieren, sonst verweigern Browser Teilen und Kopieren
function shareLink(created) {
  const link = roomLink(), hello = created ? `Raum „${roomLabel}“ erstellt – ` : '';
  if (touchMode && navigator.share) {
    navigator.share({ title: 'Kart Racer', text: 'Fahr mit mir Kart Racer! 🏎️', url: link })
      .catch(e => { if (!e || e.name !== 'AbortError') showToast(hello + 'kopiere diesen Link:', link); });
    return;
  }
  const copy = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(link) : Promise.reject();
  copy.then(() => showToast(hello + 'Link kopiert! Schick ihn deinen Freunden.'))
      .catch(() => showToast(hello + 'kopiere diesen Link:', link));
}

document.getElementById('room-new').addEventListener('click', () => { wake(); joinRoom(newRoomName()); shareLink(true); });
document.getElementById('room-share').addEventListener('click', () => { wake(); shareLink(false); });
roomLobbyBtn.addEventListener('click', () => { joinRoom('lobby'); showToast('Du bist wieder in der offenen Lobby.'); });

function syncRoomUi() {
  const show = !!(room && room.switchRoom) && state === 'menu' && !optionsOpen;
  if (roomUi.hidden === show) roomUi.hidden = !show;
  const label = 'Raum: ' + roomLabel;
  if (roomNameEl.textContent !== label) roomNameEl.textContent = label;
  const inLobby = roomLabel === 'lobby';
  if (roomLobbyBtn.hidden !== inLobby) roomLobbyBtn.hidden = inLobby;
}
out.focus();
</script>
